<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Al Día · Austin Eco Bilingual School</title>
<link rel="icon" type="image/jpeg" href="austin-eco-bilingual-school-campana-argentina.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ─────────────────────────────────────────────
   AL DÍA · Austin Eco Bilingual School
   Formación continua por cápsulas + encuestas.
   Maqueta de presentación — datos de demo.
   ───────────────────────────────────────────── */
:root{
  --naranja:#F18636;
  --naranja-2:#FDB273;
  --naranja-luz:#FEF1E6;
  --lima:#A9CF44;
  --lima-2:#8FB534;
  --lima-luz:#F1F7E2;
  --petroleo:#26343E;
  --petroleo-2:#35505E;
  --petroleo-3:#4E6B7A;
  --petroleo-luz:#E9EFF2;
  --fondo:#F4F6F5;
  --carta:#FFFFFF;
  --tinta:#26343E;
  --tinta-2:#5A6B75;
  --tinta-3:#93A1A9;
  --linea:#DFE5E5;
  --linea-2:#EDF1F0;
  --r:18px;
  --sombra:0 1px 2px rgba(38,52,62,.04), 0 10px 30px -14px rgba(38,52,62,.18);
  --curva:cubic-bezier(.22,.68,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--fondo);color:var(--tinta);
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:700;line-height:1.16;letter-spacing:-.022em}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2.5px solid var(--petroleo);outline-offset:2px;border-radius:6px}
.envoltura{max-width:1090px;margin:0 auto;padding:0 28px}

/* ── Transiciones ───────────────────────────── */
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes entraSuave{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sellar{
  0%{opacity:0;transform:scale(2.4) rotate(-18deg)}
  55%{opacity:1;transform:scale(.86) rotate(4deg)}
  75%{transform:scale(1.08) rotate(-2deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}
@keyframes brillo{from{background-position:-260px 0}to{background-position:340px 0}}
@keyframes pulso{0%,100%{opacity:1}50%{opacity:.42}}
.anim{animation:entra .42s var(--curva) both}
.escalon{animation:entraSuave .44s var(--curva) both}
button:active{transform:scale(.985)}
.btn,.ficha,.lista-capsula,.opcion,.pestanas button{transition:all .22s var(--curva)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── Cabecera ───────────────────────────────── */
.tope{background:var(--carta);border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:30}
.tope .envoltura{display:flex;align-items:center;gap:20px;padding:13px 28px}
.logo{display:flex;align-items:center;gap:12px}
.logo b{font-size:18px;font-weight:800;display:block;line-height:1.1;letter-spacing:-.03em}
.logo span{font-size:10.5px;color:var(--tinta-3);letter-spacing:.13em;font-weight:600}
.rolcambio{margin-left:auto;background:var(--fondo);border-radius:12px;padding:3px;display:flex;gap:3px}
.rolcambio button{padding:7px 16px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--tinta-2)}
.rolcambio button.on{background:var(--carta);color:var(--petroleo);box-shadow:0 1px 4px rgba(38,52,62,.11)}
.persona{display:flex;align-items:center;gap:12px}
.persona .av{width:36px;height:36px;border-radius:12px;flex:0 0 36px;display:grid;place-items:center;
  font-size:13px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--petroleo),var(--petroleo-2))}
.persona-info{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px}
.persona b{font-size:14px;font-weight:700;display:block;line-height:1.2}
.persona small{font-size:12px;color:var(--tinta-3);display:block}

.pestanas{background:var(--carta);border-bottom:1px solid var(--linea)}
.pestanas .envoltura{display:flex;gap:2px;overflow-x:auto}
.pestanas button{padding:13px 16px;font-size:14.5px;color:var(--tinta-2);font-weight:600;
  border-bottom:2.5px solid transparent;white-space:nowrap;position:relative}
.pestanas button:hover{color:var(--petroleo)}
.pestanas button.on{color:var(--petroleo);border-bottom-color:var(--lima)}
.pin{background:var(--naranja);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;
  border-radius:20px;margin-left:7px;animation:pulso 2.6s ease-in-out infinite}

main{padding:34px 0 84px}

/* ── Encabezado ─────────────────────────────── */
.cabecera{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:26px;flex-wrap:wrap}
.cabecera h1{font-size:31px}
.cabecera p{color:var(--tinta-2);margin-top:7px;max-width:60ch}
.contador{text-align:right}
.contador b{font-size:32px;font-weight:800;display:block;line-height:1;color:var(--petroleo)}
.contador span{font-size:12.5px;color:var(--tinta-3);font-weight:600}

/* ── Cápsula destacada ──────────────────────── */
.destacada{background:linear-gradient(135deg,var(--petroleo) 0%,var(--petroleo-2) 100%);
  color:#fff;border-radius:24px;padding:32px 34px;margin-bottom:34px;position:relative;overflow:hidden;
  box-shadow:0 20px 50px -22px rgba(38,52,62,.55)}
.destacada::before{content:"";position:absolute;right:-60px;top:-100px;width:290px;height:290px;
  border-radius:50%;background:radial-gradient(circle,rgba(169,207,68,.30),transparent 68%)}
.destacada::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;
  background:linear-gradient(90deg,var(--lima),var(--petroleo-2))}
.destacada .rel{position:relative;z-index:1}
.marbete{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.09em;
  background:rgba(169,207,68,.22);color:var(--lima);padding:5px 13px;border-radius:20px;margin-bottom:15px}
.marbete i{width:6px;height:6px;border-radius:50%;background:var(--naranja);animation:pulso 2.2s ease-in-out infinite}
.destacada h2{font-size:29px;max-width:23ch}
.destacada p{color:rgba(255,255,255,.78);margin-top:11px;max-width:60ch}
.destacada .meta{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.destacada .meta span{font-size:12.5px;background:rgba(255,255,255,.11);padding:5px 13px;border-radius:20px;
  color:rgba(255,255,255,.85);font-weight:500}
.acciones{display:flex;gap:11px;flex-wrap:wrap;margin-top:24px}

/* ── Fichero ────────────────────────────────── */
.rotulo{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:36px 0 15px}
.rotulo h3{font-size:19px}
.rotulo span{font-size:13px;color:var(--tinta-3);font-weight:600}
.fichero{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:13px}
.ficha{background:var(--carta);border:1.5px solid var(--linea-2);border-radius:var(--r);padding:18px 19px;
  text-align:left;position:relative;min-height:146px;display:flex;flex-direction:column;overflow:hidden}
.ficha::before{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:var(--naranja);transition:width .24s var(--curva)}
.ficha:hover{border-color:var(--naranja-2);transform:translateY(-3px);box-shadow:var(--sombra)}
.ficha:hover::before{width:4px}
.ficha .mes{font-size:11px;letter-spacing:.11em;color:var(--tinta-3);font-weight:700;margin-bottom:9px}
.ficha b{font-size:15.5px;font-weight:700;line-height:1.35;display:block;padding-right:26px}
.ficha small{font-size:12.5px;color:var(--tinta-3);margin-top:auto;padding-top:14px;display:block;font-weight:500}
.ficha.sellada{background:transparent;border-color:var(--linea);border-style:dashed}
.ficha.sellada b{color:var(--tinta-2)}
.ficha.pendiente{border-color:var(--naranja);box-shadow:0 0 0 4px var(--naranja-luz)}
.ficha.bloqueada{opacity:.5;cursor:default}
.ficha.bloqueada:hover{transform:none;border-color:var(--linea-2);box-shadow:none}
.sello{position:absolute;top:15px;right:15px;width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;background:var(--lima-luz);color:var(--lima-2);
  border:1.5px solid var(--lima);font-weight:800;font-size:13px;animation:sellar .5s var(--curva) both}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 11px;border-radius:20px}
.chip.espera{background:var(--naranja-luz);color:#B45E12}
.chip.hecho{background:var(--lima-luz);color:var(--lima-2)}
.chip.futuro{background:var(--linea-2);color:var(--tinta-3)}

/* ── Lectura ────────────────────────────────── */
.volver{display:inline-flex;gap:7px;color:var(--tinta-3);font-size:13.5px;margin-bottom:16px;font-weight:600}
.volver:hover{color:var(--petroleo)}
.lienzo{background:var(--carta);border:1px solid var(--linea-2);border-radius:24px;padding:34px 36px;max-width:770px;
  box-shadow:var(--sombra)}
.lienzo h1{font-size:29px;margin-bottom:9px}
.lienzo .autoria{font-size:13px;color:var(--tinta-3);margin-bottom:26px;font-weight:600}
.lienzo p{color:var(--tinta-2);margin-bottom:15px;max-width:70ch}
.lienzo p strong{color:var(--petroleo);font-weight:700}
.medio{background:linear-gradient(100deg,var(--fondo) 25%,#EAEFEE 50%,var(--fondo) 75%);
  background-size:600px 100%;animation:brillo 2.6s linear infinite;
  border-radius:16px;height:206px;display:grid;place-items:center;color:var(--tinta-3);font-size:13.5px;
  margin:24px 0;font-weight:600}
.recurso{display:flex;align-items:center;gap:13px;padding:14px 17px;border:1px solid var(--linea);
  border-radius:14px;margin-bottom:9px;background:var(--fondo);transition:border-color .2s}
.recurso:hover{border-color:var(--naranja-2)}
.recurso .ic{width:36px;height:36px;border-radius:11px;background:var(--petroleo-luz);color:var(--petroleo);
  display:grid;place-items:center;flex:0 0 36px;font-weight:700}
.recurso b{font-size:14.5px;font-weight:700;display:block}
.recurso small{font-size:12.5px;color:var(--tinta-3)}
.chequeo{border-top:1px solid var(--linea);margin-top:30px;padding-top:26px}
.chequeo h3{font-size:19px;margin-bottom:5px}
.chequeo .sub{font-size:13.5px;color:var(--tinta-3);margin-bottom:18px}
.opcion{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--linea);
  border-radius:14px;margin-bottom:9px;cursor:pointer;background:var(--carta)}
.opcion:hover{border-color:var(--naranja-2);transform:translateX(3px)}
.opcion.elegida{border-color:var(--petroleo-2);background:var(--petroleo-luz)}
.opcion input{margin-top:4px;accent-color:var(--petroleo)}
.acepto{display:flex;gap:13px;align-items:flex-start;background:var(--lima-luz);border-radius:14px;
  padding:16px 18px;margin-top:18px;border:1.5px solid transparent;transition:border-color .2s}
.acepto.marcada{border-color:var(--lima)}
.acepto input{margin-top:3px;width:18px;height:18px;accent-color:var(--lima-2);flex:0 0 18px}
.acepto label{font-size:14.5px;color:var(--tinta-2);cursor:pointer}
.acepto b{color:var(--petroleo);font-weight:700}

/* ── Encuestas ──────────────────────────────── */
.pregunta{margin-bottom:28px}
.pregunta h4{font-size:16.5px;font-weight:700;margin-bottom:12px}
.escala-fila{display:flex;gap:8px;flex-wrap:wrap}
.escala-fila button{flex:1;min-width:54px;padding:13px 6px;border:1.5px solid var(--linea);border-radius:13px;
  background:var(--carta);font-weight:700}
.escala-fila button:hover{border-color:var(--naranja-2);transform:translateY(-2px)}
.escala-fila button.on{background:var(--petroleo);color:#fff;border-color:var(--petroleo)}
.abierta{width:100%;padding:13px 15px;border:1.5px solid var(--linea);border-radius:13px;
  background:var(--carta);min-height:94px;resize:vertical}
.abierta:focus{border-color:var(--petroleo);outline:none}
.resultado{margin-bottom:24px}
.resultado h4{font-size:15.5px;font-weight:700;margin-bottom:12px}
.barra-r{display:flex;align-items:center;gap:12px;margin-bottom:7px;font-size:13.5px}
.barra-r .et{width:150px;color:var(--tinta-2);flex:0 0 150px;font-weight:500}
.barra-r .bar{flex:1;height:24px;background:var(--linea-2);border-radius:8px;overflow:hidden}
.barra-r .bar i{display:block;height:100%;border-radius:8px;
  background:linear-gradient(90deg,var(--lima-2),var(--lima));
  animation:crecer .8s var(--curva) both}
@keyframes crecer{from{width:0!important}}
.barra-r .n{width:44px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.cita{border-left:3px solid var(--lima);padding:3px 0 3px 15px;margin-bottom:12px;
  font-size:14px;color:var(--tinta-2);font-style:italic}

/* ── Coordinación ───────────────────────────── */
.tablero{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:13px;margin-bottom:30px}
.kpi{background:var(--carta);border:1px solid var(--linea-2);border-radius:var(--r);padding:20px 21px;
  position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--petroleo)}
.kpi:nth-child(2)::after{background:var(--lima)}
.kpi:nth-child(3)::after{background:var(--petroleo-2)}
.kpi:nth-child(4)::after{background:var(--naranja)}
.kpi b{font-size:32px;font-weight:800;display:block;line-height:1;color:var(--petroleo)}
.kpi span{font-size:13px;color:var(--tinta-2);display:block;margin-top:5px;font-weight:600}
.kpi small{font-size:12px;color:var(--tinta-3)}

.tabla{background:var(--carta);border:1px solid var(--linea-2);border-radius:var(--r);overflow:auto;box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--linea-2);white-space:nowrap}
th{font-size:11px;letter-spacing:.07em;color:var(--tinta-3);font-weight:700;position:sticky;top:0;background:var(--carta)}
th.rot{writing-mode:vertical-rl;transform:rotate(180deg);height:128px;padding:10px 6px;text-align:right}
td.nom{font-weight:600;position:sticky;left:0;background:var(--carta);min-width:186px}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--fondo)}
tbody tr:hover td.nom{background:var(--fondo)}
.marca-si{width:21px;height:21px;border-radius:7px;background:var(--lima-luz);color:var(--lima-2);
  display:grid;place-items:center;font-size:12px;font-weight:800}
.marca-no{width:21px;height:21px;border-radius:7px;background:var(--fondo);border:1.5px dashed var(--linea)}
.marca-tarde{width:21px;height:21px;border-radius:7px;background:var(--naranja-luz);color:var(--naranja);
  display:grid;place-items:center;font-size:12px;font-weight:800}

.lista-capsula{background:var(--carta);border:1px solid var(--linea-2);border-radius:var(--r);
  padding:17px 20px;margin-bottom:10px;display:flex;align-items:center;gap:16px;width:100%;text-align:left}
.lista-capsula:hover{border-color:var(--naranja-2);transform:translateX(3px)}
.lista-capsula .cu{flex:1;min-width:0}
.lista-capsula .cu b{display:block;font-size:15.5px;font-weight:700}
.lista-capsula .cu small{color:var(--tinta-3);font-size:12.5px;font-weight:500}
.progreso{width:136px}
.progreso span{font-size:12.5px;color:var(--tinta-2);font-weight:700}
.progreso .bar{height:7px;background:var(--linea-2);border-radius:7px;overflow:hidden;margin-top:6px}
.progreso .bar i{display:block;height:100%;border-radius:7px;
  background:linear-gradient(90deg,var(--lima-2),var(--lima));animation:crecer .8s var(--curva) both}

/* ── Botones, modal, aviso ──────────────────── */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 21px;border-radius:13px;
  font-size:14.5px;font-weight:700}
.btn-p{background:var(--petroleo);color:#fff;box-shadow:0 6px 18px -8px rgba(38,52,62,.55)}
.btn-p:hover{background:#1B252C;transform:translateY(-1px)}
.btn-p:disabled{background:var(--linea);color:var(--tinta-3);cursor:not-allowed;box-shadow:none;transform:none}
.btn-s{background:var(--carta);border:1.5px solid var(--linea);color:var(--tinta)}
.btn-s:hover{border-color:var(--petroleo-3);color:var(--petroleo)}
.btn-f{background:#fff;color:var(--petroleo)}
.btn-f:hover{background:var(--petroleo);color:#fff;transform:translateY(-1px)}
.btn-l{background:var(--lima);color:var(--petroleo)}
.btn-l:hover{background:var(--lima-2)}
.vacio{text-align:center;padding:46px 20px;color:var(--tinta-3);background:var(--carta);
  border:1.5px dashed var(--linea);border-radius:var(--r)}
.vacio b{display:block;font-size:18px;color:var(--tinta);margin-bottom:6px;font-weight:700}

.telon{position:fixed;inset:0;background:rgba(38,52,62,.5);backdrop-filter:blur(4px);
  display:grid;place-items:center;padding:20px;z-index:60;animation:entraSuave .2s ease both}
.modal{background:var(--carta);border-radius:24px;padding:30px 32px;width:min(570px,100%);
  max-height:88dvh;overflow:auto;animation:entra .32s var(--curva) both}
.modal h2{font-size:24px;margin-bottom:5px}
.modal .sub{color:var(--tinta-3);font-size:13.5px;margin-bottom:22px}
.campo{margin-bottom:15px}
.campo label{display:block;font-size:12.5px;color:var(--tinta-2);margin-bottom:7px;font-weight:700}
.campo input,.campo textarea,.campo select{width:100%;padding:12px 14px;border:1.5px solid var(--linea);
  border-radius:12px;background:var(--fondo);font-size:14.5px}
.campo input:focus,.campo textarea:focus,.campo select:focus{border-color:var(--petroleo);outline:none;background:var(--carta)}
.campo textarea{min-height:92px;resize:vertical}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.tostada{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:80;background:var(--petroleo);
  color:#fff;padding:14px 22px;border-radius:14px;font-size:14px;font-weight:600;
  box-shadow:0 18px 44px -14px rgba(38,52,62,.75);animation:entra .26s var(--curva) both;
  display:flex;align-items:center;gap:10px;max-width:92vw}
.tostada i{width:8px;height:8px;border-radius:50%;background:var(--lima);flex:0 0 8px}

/* ── Acceso ─────────────────────────────────── */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--fondo)}
.login-card{width:100%;max-width:400px;background:var(--carta);border:1px solid var(--linea-2);border-radius:24px;
  padding:40px 36px;text-align:center;box-shadow:var(--sombra)}
.login-card .logo{justify-content:center;margin-bottom:18px}
.login-card h1{font-size:22px;margin-bottom:8px}
.login-card p{color:var(--tinta-2);font-size:14px;margin-bottom:24px;line-height:1.5}
.login-card input{width:100%;padding:13px 14px;border:1.5px solid var(--linea);border-radius:12px;
  margin-bottom:12px;font-size:14.5px;background:var(--fondo)}
.login-card input:focus{border-color:var(--petroleo);outline:none;background:var(--carta)}
.login-msg{margin-top:14px;font-size:13px;color:var(--lima-2);min-height:18px;font-weight:600}
.login-msg.error{color:#C0503B}
#loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;
  color:var(--tinta-3);font-size:14px}
.btn-logout{background:none;border:1px solid var(--linea);color:var(--tinta-3);
  padding:5px 11px;border-radius:8px;font-size:11.5px;font-weight:600}
.btn-logout:hover{border-color:var(--tinta-3);color:var(--tinta)}

@media (max-width:720px){
  .envoltura{padding:0 18px}
  .tope .envoltura{padding:12px 18px;gap:12px}
  .persona div{display:none}
  .persona .btn-logout{display:none}
  .logo span{display:none}
  .cabecera h1{font-size:25px}

<script>
/* ═══════════════════════════════════════════════
   CONFIGURACIÓN
   ═══════════════════════════════════════════════ */
const CONFIG = {
  COLEGIO:"Austin Eco Bilingual School",
  TEXTO_ACUSE:"Leí este material y entiendo que forma parte de los acuerdos institucionales vigentes de Austin.",
  MINIMO_ANUAL:12
};

const hoy = new Date();
const MES = ["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];

/* ═══════════════════════════════════════════════
   SUPABASE · datos reales
   ═══════════════════════════════════════════════ */
const SUPABASE_URL = 'https://kretfnbddhbosacfgdup.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtyZXRmbmJkZGhib3NhY2ZnZHVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0Mjk3MTcsImV4cCI6MjA4NzAwNTcxN30.P0HLqGab3tB5WdsVGYKXEyK572JvthHYFg7iu3MJpgo';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let YO = null, YO_ID = null, YO_EMAIL = null, YO_NOMBRE = "Vos";
let esCoordinador = false;
let EQUIPO = [];
let CAPSULAS = [];
let ENCUESTAS = [];
let RESULTADOS_ENCUESTA = {};
let onboardingPct = 0;
let onboardingCompleto = false;
const REGISTRO = {};

function fmtFecha(iso){
  return new Date(iso).toLocaleDateString('es-AR', { day:'numeric', month:'long' });
}
function nombreDeEmail(email){
  if (email === YO) return YO_NOMBRE;
  const local = String(email).split('@')[0];
  return local.split(/[._]/).filter(Boolean).map(s => s.charAt(0).toUpperCase()+s.slice(1)).join(' ');
}
function iniciales(nombre){
  return String(nombre).trim().split(/\s+/).map(s => s[0]).join('').slice(0,2).toUpperCase() || '—';
}

async function cargarDatos(){
  const emailNormalizado = YO_EMAIL.trim().toLowerCase();
  const [capsRes, encRes, miConfRes, misRespRes, coordRes, dirRes, progRes, stepsRes] = await Promise.all([
    sb.from('capsulas').select('*').order('publicado_en'),
    sb.from('encuestas').select('*').order('created_at', { ascending:false }),
    sb.from('capsula_confirmaciones').select('capsula_id').eq('user_id', YO_ID),
    sb.from('encuesta_respuestas').select('encuesta_id').eq('user_id', YO_ID),
    sb.from('coordinadores').select('email').eq('email', emailNormalizado).maybeSingle(),
    sb.from('directores').select('email').eq('email', emailNormalizado).maybeSingle(),
    sb.from('user_progress').select('step_id').eq('user_id', YO_ID),
    sb.from('onboarding_steps').select('id'),
  ]);

  esCoordinador = !!(coordRes.data || dirRes.data);

  const totalPasosOnboarding = (stepsRes.data || []).length;
  const pasosHechosOnboarding = (progRes.data || []).length;
  onboardingPct = totalPasosOnboarding ? Math.round(pasosHechosOnboarding / totalPasosOnboarding * 100) : 0;
  onboardingCompleto = totalPasosOnboarding > 0 && pasosHechosOnboarding >= totalPasosOnboarding;

  CAPSULAS = (capsRes.data || []).map(k => ({
    id:k.id, mes:new Date(k.publicado_en).getMonth(), titulo:k.titulo, resumen:k.resumen,
    autor:k.autor, min:k.min_lectura, tipo:k.tipo, cuerpo:k.cuerpo||[], recursos:k.recursos||[],
    chequeo:k.chequeo, futura:k.futura, publicado_en:k.publicado_en, plazo_dias:k.plazo_dias
  }));

  Object.keys(REGISTRO).forEach(k => delete REGISTRO[k]);
  CAPSULAS.forEach(k => { REGISTRO[k.id] = {}; });

  const misConf = new Set((miConfRes.data || []).map(r => r.capsula_id));
  CAPSULAS.filter(k => !k.futura).forEach(k => {
    REGISTRO[k.id][YO] = misConf.has(k.id) ? "si" : "no";
  });

  EQUIPO = [YO];
  if (esCoordinador){
    const { data: seg } = await sb.rpc('aldia_seguimiento_capsulas');
    const personas = new Set([YO]);
    (seg || []).forEach(row => {
      personas.add(row.email);
      if (!REGISTRO[row.capsula_id]) REGISTRO[row.capsula_id] = {};
      REGISTRO[row.capsula_id][row.email] = row.estado;
    });
    EQUIPO = Array.from(personas).sort();
  }

  const misResp = new Set((misRespRes.data || []).map(r => r.encuesta_id));
  ENCUESTAS = (encRes.data || []).map(e => ({
    id:e.id, titulo:e.titulo, preguntas:e.preguntas||[], abierta:e.abierta,
    cierra: e.abierta
      ? (e.cierra_en ? `Cierra el ${fmtFecha(e.cierra_en)}` : "Abierta")
      : `Cerrada${e.cierra_en ? ' el ' + fmtFecha(e.cierra_en) : ''}`,
    cierra_en:e.cierra_en, respondida: misResp.has(e.id)
  }));

  await cargarResultadosEncuestas();
}

async function cargarResultadosEncuestas(){
  RESULTADOS_ENCUESTA = {};
  if (!esCoordinador || !ENCUESTAS.length) return;
  const { data, error } = await sb.from('encuesta_respuestas').select('encuesta_id, respuestas');
  if (error || !data) return;
  const porEncuesta = {};
  data.forEach(row => { (porEncuesta[row.encuesta_id] ||= []).push(row.respuestas || {}); });
  ENCUESTAS.forEach(e => {
    const filas = porEncuesta[e.id] || [];
    RESULTADOS_ENCUESTA[e.id] = {
      totalRespondidas: filas.length,
      preguntas: e.preguntas.map((q,i) => {
        if (q.t === 'escala'){
          const vals = filas.map(f => Number(f[i])).filter(v => !isNaN(v));
          const barras = [];
          for (let v=q.min; v<=q.max; v++){
            const label = v===q.min ? `${v} · muy floja` : v===q.max ? `${v} · muy buena` : String(v);
            barras.push([label, vals.filter(x => x===v).length]);
          }
          const promedio = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
          return { tipo:'escala', pregunta:q.p, barras, promedio };
        }
        if (q.t === 'opciones'){
          const barras = q.op.map((label,j) => [label, filas.filter(f => Number(f[i])===j).length]);
          return { tipo:'opciones', pregunta:q.p, barras };
        }
        const citas = filas.map(f => f[i]).filter(v => v && String(v).trim());
        return { tipo:'abierta', pregunta:q.p, citas };
      })
    };
  });
}

/* ═══════════════════════════════════════════════
   ESTADO
   ═══════════════════════════════════════════════ */
const estado = { rol:"docente", vista:"capsulas", capsula:null, encuesta:null,
                 respuesta:null, acepta:false, borrador:{} };
let PERFIL = {};
const PESTANAS = {
  docente:[["capsulas","Mis cápsulas"],["encuestas","Encuestas"],["historial","Mi historial"]],
  coordinacion:[["seguimiento","Seguimiento"],["biblioteca","Cápsulas"],["encuestas","Encuestas"]]
};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (a,b) => Math.round(a/Math.max(b,1)*100);

function tostada(m){
  const v = $(".tostada"); if (v) v.remove();
  const t = document.createElement("div"); t.className = "tostada";
  t.innerHTML = `<i></i><span>${esc(m)}</span>`; t.setAttribute("role","status");
  document.body.appendChild(t); setTimeout(()=>t.remove(),3400);
}
const cerrarModal = () => $("#capa").innerHTML = "";
function abrirModal(html){
  $("#capa").innerHTML = `<div class="telon" id="telon"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#telon").addEventListener("click", e => { if (e.target.id === "telon") cerrarModal(); });
  const p = $("#capa input, #capa textarea, #capa button"); if (p) p.focus();
}
document.addEventListener("keydown", e => { if (e.key === "Escape") cerrarModal(); });

/* ═══════════════════════════════════════════════
   VISTAS · DOCENTE
   ═══════════════════════════════════════════════ */
function misCapsulas(){
  const publicadas = CAPSULAS.filter(k => !k.futura);
  const hechas = publicadas.filter(k => REGISTRO[k.id][YO] === "si").length;
  const actual = publicadas.find(k => REGISTRO[k.id][YO] !== "si");

  const fichas = CAPSULAS.map((k,i) => {
    const hecha = !k.futura && REGISTRO[k.id][YO] === "si";
    const clase = k.futura ? "bloqueada" : hecha ? "sellada" : "pendiente";
    return `<button class="ficha ${clase} escalon" style="animation-delay:${60 + i*45}ms"
      ${k.futura ? "disabled" : `data-abrir="${k.id}"`}>
      <div class="mes">${MES[k.mes % 12]}</div>
      <b>${esc(k.titulo)}</b>
      ${hecha ? `<span class="sello">✓</span>` : ""}
      <small>${k.futura ? "Se publica pronto" : `${k.min} min · ${esc(k.tipo)}`}</small>
    </button>`;
  }).join("");

  return `
  <div class="cabecera anim">
    <div>
      <h1>Formación continua</h1>
      <p>Una cápsula por mes, de cuatro a siete minutos. Confirmarla deja constancia de que la leíste — con fecha y hora, igual que la firma en el libro.</p>
    </div>
    <div class="contador"><b>${hechas}/${CONFIG.MINIMO_ANUAL}</b><span>DEL CICLO</span></div>
  </div>

  ${actual ? `
  <div class="destacada anim" style="animation-delay:70ms"><div class="rel">
    <span class="marbete"><i></i>${MES[actual.mes % 12]} · SIN CONFIRMAR</span>
    <h2>${esc(actual.titulo)}</h2>
    <p>${esc(actual.resumen)}</p>
    <div class="meta">
      <span>${actual.min} minutos</span><span>${esc(actual.tipo)}</span><span>${esc(actual.autor)}</span>
    </div>
    <div class="acciones"><button class="btn btn-f" data-abrir="${actual.id}">Abrir la cápsula →</button></div>
  </div></div>` : `
  <div class="destacada anim" style="animation-delay:70ms"><div class="rel">
    <span class="marbete">AL DÍA</span>
    <h2>No tenés nada pendiente.</h2>
    <p>Confirmaste todas las cápsulas publicadas hasta hoy. La próxima se publica el primer lunes del mes.</p>
  </div></div>`}

  <div class="rotulo anim" style="animation-delay:100ms">
    <h3>Hito 1 · Se hace una vez</h3><span>${onboardingCompleto ? "Completado" : "Pendiente"}</span>
  </div>
  <div class="fichero" style="margin-bottom:10px">
    <a class="ficha ${onboardingCompleto ? "sellada" : "pendiente"} escalon" style="animation-delay:110ms;text-decoration:none;color:inherit;cursor:pointer"
      href="../ONBOARDING%20AUSTIN/index.html" target="_blank" rel="noopener">
      <div class="mes">ONBOARDING</div>
      <b>Bienvenida a Austin</b>
      ${onboardingCompleto ? `<span class="sello">✓</span>` : ""}
      <small>${onboardingCompleto ? "Completado" : `${onboardingPct}% completado · abrir →`}</small>
    </a>
  </div>

  <div class="rotulo anim" style="animation-delay:130ms">
    <h3>El fichero del ciclo</h3><span>${hechas} de ${publicadas.length} publicadas</span>
  </div>
  <div class="fichero">${fichas}</div>`;
}

function leerCapsula(){
  const k = CAPSULAS.find(x => x.id === estado.capsula);
  const hecha = REGISTRO[k.id][YO] === "si";
  return `
  <button class="volver" data-vista="capsulas">← Mis cápsulas</button>
  <div class="lienzo anim">
    <h1>${esc(k.titulo)}</h1>
    <div class="autoria">${esc(k.autor)} · ${MES[k.mes % 12].toLowerCase()} · ${k.min} minutos de lectura</div>
    ${k.cuerpo.map(p => `<p>${p}</p>`).join("")}
    <div class="medio">Video o material embebido</div>
    ${k.recursos.map(([n,m]) => `<div class="recurso"><span class="ic">↓</span><div><b>${esc(n)}</b><small>${esc(m)}</small></div></div>`).join("")}

    <div class="chequeo">
      ${hecha ? `
        <h3>Ya confirmaste esta cápsula</h3>
        <div class="sub">Registrada a tu nombre. Coordinación la ve en el seguimiento.</div>
        <span class="chip hecho" style="font-size:13px;padding:7px 15px">✓ Confirmada</span>
      ` : `
        <h3>Antes de confirmar</h3>
        <div class="sub">Una situación para resolver. No se califica: sirve para saber si el material se entendió.</div>
        <h4 style="font-size:16.5px;font-weight:700;margin-bottom:13px">${esc(k.chequeo.p)}</h4>
        ${k.chequeo.op.map((o,i) => `
          <label class="opcion ${estado.respuesta===i?"elegida":""}">
            <input type="radio" name="op" ${estado.respuesta===i?"checked":""} data-op="${i}">
            <span>${esc(o)}</span>
          </label>`).join("")}
        <div class="acepto ${estado.acepta?"marcada":""}">
          <input type="checkbox" id="acepto" ${estado.acepta?"checked":""} data-acepta>
          <label for="acepto"><b>Leí y lo sé.</b> ${esc(CONFIG.TEXTO_ACUSE)}</label>
        </div>
        <div class="acciones">
          <button class="btn btn-p" data-accion="confirmar" ${(estado.respuesta===null || !estado.acepta)?"disabled":""}>Confirmar</button>
          <button class="btn btn-s" data-vista="capsulas">Seguir después</button>
        </div>`}
    </div>
  </div>`;
}

function misEncuestas(){
  const abiertas = ENCUESTAS.filter(e => e.abierta);
  const cerradas = ENCUESTAS.filter(e => !e.abierta);
  return `
  <div class="cabecera anim"><div>
    <h1>Encuestas</h1>
    <p>Relevamientos internos. Los resultados se muestran agregados y las respuestas abiertas se leen sin nombre.</p>
  </div></div>
  ${abiertas.length ? abiertas.map((e,i) => e.respondida ? `
    <div class="lista-capsula escalon" style="animation-delay:${i*60}ms">
      <span class="cu"><b>${esc(e.titulo)}</b><small>${e.preguntas.length} preguntas · ${esc(e.cierra)}</small></span>
      <span class="chip hecho">Respondida</span>
    </div>` : `
    <button class="lista-capsula escalon" style="animation-delay:${i*60}ms" data-encuesta="${e.id}">
      <span class="cu"><b>${esc(e.titulo)}</b><small>${e.preguntas.length} preguntas · ${esc(e.cierra)}</small></span>
      <span class="chip espera">Sin responder</span>
    </button>`).join("")
    : `<div class="vacio anim"><b>No hay encuestas abiertas</b>Te avisamos cuando se publique una.</div>`}
  <div class="rotulo"><h3>Cerradas</h3></div>
  ${cerradas.length ? cerradas.map(e => `
    <div class="lista-capsula"><span class="cu"><b>${esc(e.titulo)}</b><small>${esc(e.cierra)}</small></span>
    <span class="chip ${e.respondida?'hecho':'futuro'}">${e.respondida?'Respondida':'No respondida'}</span></div>`).join("")
    : `<div style="color:var(--tinta-3);font-size:13.5px;padding:4px 2px">Todavía no hay encuestas cerradas.</div>`}`;
}

function responderEncuesta(){
  const e = ENCUESTAS.find(x => x.id === estado.encuesta);
  return `
  <button class="volver" data-vista="encuestas">← Encuestas</button>
  <div class="lienzo anim">
    <h1>${esc(e.titulo)}</h1>
    <div class="autoria">${esc(e.cierra)} · ${e.preguntas.length} preguntas · unos 3 minutos</div>
    ${e.preguntas.map((q,i) => {
      if (q.t === "escala") return `
        <div class="pregunta"><h4>${esc(q.p)}</h4>
          <div class="escala-fila">${Array.from({length:q.max-q.min+1},(_,j)=>q.min+j).map(v =>
            `<button data-resp="${i}" data-valor="${v}" class="${estado.borrador[i]==v?"on":""}">${v}</button>`).join("")}</div>
          <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--tinta-3);margin-top:7px;font-weight:600">
            <span>Muy floja</span><span>Muy buena</span></div>
        </div>`;
      if (q.t === "opciones") return `
        <div class="pregunta"><h4>${esc(q.p)}</h4>
          ${q.op.map((o,j) => `<label class="opcion ${estado.borrador[i]==j?"elegida":""}">
            <input type="radio" name="q${i}" ${estado.borrador[i]==j?"checked":""} data-resp="${i}" data-valor="${j}">
            <span>${esc(o)}</span></label>`).join("")}
        </div>`;
      return `<div class="pregunta"><h4>${esc(q.p)}</h4>
        <textarea class="abierta" data-libre="${i}" placeholder="Opcional. No se muestra con tu nombre.">${esc(estado.borrador[i]||"")}</textarea></div>`;
    }).join("")}
    <div class="acciones"><button class="btn btn-p" data-accion="enviar-encuesta">Enviar respuestas</button></div>
  </div>`;
}

function miHistorial(){
  const publicadas = CAPSULAS.filter(k => !k.futura);
  return `
  <div class="cabecera anim"><div>
    <h1>Mi historial</h1>
    <p>Constancia de todo lo que confirmaste este ciclo lectivo. Se exporta para el legajo.</p>
  </div>
  <div class="acciones"><button class="btn btn-s" data-accion="exportar">Descargar constancia</button></div></div>
  <div class="tabla anim"><table>
    <tr><th>Cápsula</th><th>Mes</th><th>Tipo</th><th>Estado</th></tr>
    ${publicadas.map(k => {
      const s = REGISTRO[k.id][YO];
      return `<tr><td class="nom">${esc(k.titulo)}</td><td>${MES[k.mes%12].toLowerCase()}</td><td>${esc(k.tipo)}</td>
        <td>${s === "si" ? `<span class="chip hecho">Confirmada</span>` : `<span class="chip espera">Pendiente</span>`}</td></tr>`;
    }).join("")}
  </table></div>`;
}

/* ═══════════════════════════════════════════════
   VISTAS · COORDINACIÓN
   ═══════════════════════════════════════════════ */
function seguimiento(){
  const publicadas = CAPSULAS.filter(k => !k.futura);
  const total = publicadas.length * EQUIPO.length;
  const hechas = publicadas.reduce((n,k) => n + EQUIPO.filter(p => REGISTRO[k.id][p] === "si").length, 0);
  const alDia = EQUIPO.filter(p => publicadas.every(k => REGISTRO[k.id][p] === "si")).length;
  const actual = publicadas[publicadas.length-1];
  const faltan = EQUIPO.filter(p => REGISTRO[actual.id][p] !== "si");

  return `
  <div class="cabecera anim"><div>
    <h1>Seguimiento del equipo</h1>
    <p>Quién confirmó qué y desde cuándo. Cada confirmación queda con fecha y hora: es la constancia de que la persona tomó conocimiento.</p>
  </div>
  <div class="acciones"><button class="btn btn-p" data-accion="recordar">Recordar a los ${faltan.length} que faltan</button></div></div>

  <div class="tablero">
    ${[[`${pct(hechas,total)}%`,"de confirmación general",`${hechas} de ${total} posibles`],
       [alDia,"personas al día",`sobre ${EQUIPO.length} del equipo`],
       [`${EQUIPO.length-faltan.length}/${EQUIPO.length}`,"en la cápsula del mes",actual.titulo],
       [publicadas.length,"cápsulas publicadas",`meta del ciclo: ${CONFIG.MINIMO_ANUAL}`]
      ].map(([b,s,p],i) => `<div class="kpi escalon" style="animation-delay:${i*70}ms">
        <b>${esc(String(b))}</b><span>${esc(s)}</span><small>${esc(p)}</small></div>`).join("")}
  </div>

  <div class="rotulo"><h3>Matriz de confirmación</h3><span>✓ confirmada · ▲ fuera de fecha · vacío sin confirmar</span></div>
  <div class="tabla anim" style="animation-delay:140ms"><table>
    <thead><tr><th>Persona</th>${CAPSULAS.map(k => `<th class="rot">${esc(k.titulo.slice(0,28))}</th>`).join("")}<th>Total</th></tr></thead>
    <tbody>${EQUIPO.map(p => {
      const n = CAPSULAS.filter(k => REGISTRO[k.id][p] === "si").length;
      return `<tr><td class="nom">${esc(nombreDeEmail(p))}</td>
        ${CAPSULAS.map(k => {
          const s = REGISTRO[k.id][p];
          return `<td>${s==="si"?`<span class="marca-si">✓</span>`:s==="tarde"?`<span class="marca-tarde">▲</span>`:`<span class="marca-no"></span>`}</td>`;
        }).join("")}<td><b>${n}</b></td></tr>`;
    }).join("")}</tbody>
  </table></div>`;
}

function biblioteca(){
  return `
  <div class="cabecera anim"><div>
    <h1>Cápsulas</h1>
    <p>Lo publicado y lo programado. Una cápsula es material breve más una confirmación; si no lleva contenido, es una encuesta.</p>
  </div>
  <div class="acciones"><button class="btn btn-p" data-accion="nueva-capsula">Crear una cápsula</button></div></div>
  ${CAPSULAS.map((k,i) => {
    const n = EQUIPO.filter(p => REGISTRO[k.id][p] === "si").length;
    return `<button class="lista-capsula escalon" style="animation-delay:${i*55}ms" data-editar="${k.id}">
      <span class="cu"><b>${esc(k.titulo)}</b><small>${MES[k.mes%12].toLowerCase()} · ${esc(k.tipo)} · ${esc(k.autor)}</small></span>
      ${k.futura ? `<span class="chip futuro">Programada</span>` :
      `<span class="progreso"><span>${n} de ${EQUIPO.length}</span>
        <span class="bar"><i style="width:${pct(n,EQUIPO.length)}%"></i></span></span>`}
    </button>`;
  }).join("")}`;
}

function encuestasCoord(){
  const totalRespuestas = ENCUESTAS.reduce((n,e) => n + (RESULTADOS_ENCUESTA[e.id]?.totalRespondidas||0), 0);
  const abiertas = ENCUESTAS.filter(e => e.abierta).length;
  return `
  <div class="cabecera anim"><div>
    <h1>Encuestas</h1>
    <p>Resultados agregados. Las respuestas abiertas se muestran sin identificar a quién las escribió.</p>
  </div>
  <div class="acciones"><button class="btn btn-p" data-accion="nueva-encuesta">Crear una encuesta</button></div></div>

  <div class="tablero">
    ${[[ENCUESTAS.length,"encuestas del ciclo",`${abiertas} abierta${abiertas===1?'':'s'}`],
       [totalRespuestas,"respuestas recibidas","en total"]
      ].map(([b,s,p],i) => `<div class="kpi escalon" style="animation-delay:${i*70}ms">
        <b>${esc(String(b))}</b><span>${esc(s)}</span><small>${esc(p)}</small></div>`).join("")}
  </div>

  ${ENCUESTAS.length ? ENCUESTAS.map((e,ei) => {
    const r = RESULTADOS_ENCUESTA[e.id] || { totalRespondidas:0, preguntas:[] };
    return `
    <div class="lienzo anim" style="max-width:100%;margin-bottom:22px;animation-delay:${ei*60}ms">
      <h2 style="font-size:20px;margin-bottom:6px">${esc(e.titulo)}</h2>
      <div class="autoria" style="margin-bottom:20px">${esc(e.cierra)} · ${r.totalRespondidas} respuesta${r.totalRespondidas===1?'':'s'}</div>
      ${r.preguntas.map(q => {
        if (q.tipo === 'abierta') return `
          <div class="resultado"><h4>${esc(q.pregunta)}</h4>
            ${q.citas.length ? q.citas.map(c => `<div class="cita">${esc(c)}</div>`).join("")
              : `<div style="color:var(--tinta-3);font-size:13.5px">Sin respuestas todavía.</div>`}
          </div>`;
        return `
          <div class="resultado"><h4>${esc(q.pregunta)}${q.promedio!=null?` · promedio ${q.promedio.toFixed(1)}`:''}</h4>
            ${q.barras.map(([et,n],i) => `<div class="barra-r"><span class="et">${esc(et)}</span>
              <span class="bar"><i style="width:${pct(n,r.totalRespondidas)}%;animation-delay:${i*80}ms"></i></span>
              <span class="n">${n}</span></div>`).join("")}
          </div>`;
      }).join("") || `<div style="color:var(--tinta-3);font-size:13.5px">Esta encuesta no tiene preguntas.</div>`}
      <div class="acciones">
        <button class="btn btn-s" data-accion="exportar">Exportar a planilla</button>
        <button class="btn btn-l" data-accion="capsulizar">Convertir en cápsula</button>
      </div>
    </div>`;
  }).join("") : `<div class="vacio anim"><b>Todavía no hay encuestas</b>Creá la primera desde "Crear una encuesta".</div>`}`;
}

/* ═══════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════ */
function pintar(resetScroll = false){
  const p = PERFIL[estado.rol];
  $("#p-nom").textContent = p.nom; $("#p-det").textContent = p.det; $("#p-av").textContent = p.av;
  document.querySelectorAll("#rolcambio button").forEach(b => b.classList.toggle("on", b.dataset.rol === estado.rol));

  const pend = CAPSULAS.filter(k => !k.futura && REGISTRO[k.id][YO] !== "si").length;
  const pendEnc = ENCUESTAS.filter(e => e.abierta && !e.respondida).length;
  const activa = estado.vista === "capsula" ? "capsulas" : estado.vista === "encuesta" ? "encuestas" : estado.vista;
  $("#pestanas").innerHTML = PESTANAS[estado.rol].map(([k,r]) =>
    `<button data-vista="${k}" class="${activa===k?"on":""}">${r}${
      (estado.rol==="docente" && k==="capsulas" && pend) ? `<span class="pin">${pend}</span>` : ""}${
      (estado.rol==="docente" && k==="encuestas" && pendEnc) ? `<span class="pin">${pendEnc}</span>` : ""}</button>`).join("");

  const V = { capsulas:misCapsulas, capsula:leerCapsula,
              encuestas: estado.rol === "docente" ? misEncuestas : encuestasCoord,
              encuesta:responderEncuesta, historial:miHistorial,
              seguimiento:seguimiento, biblioteca:biblioteca };
  $("#cuerpo").innerHTML = (V[estado.vista] || misCapsulas)();
  if (resetScroll) window.scrollTo({ top:0, behavior:"instant" });
}

/* ═══════════════════════════════════════════════
   EVENTOS
   ═══════════════════════════════════════════════ */
document.addEventListener("click", e => {
  const t = e.target;
  const r = t.closest("[data-rol]");
  if (r){ estado.rol = r.dataset.rol; estado.vista = r.dataset.rol === "docente" ? "capsulas" : "seguimiento"; pintar(true); return; }
  const v = t.closest("[data-vista]");
  if (v){ estado.vista = v.dataset.vista; estado.respuesta = null; estado.acepta = false; pintar(true); return; }
  const a = t.closest("[data-abrir]");
  if (a){ estado.capsula = a.dataset.abrir; estado.vista = "capsula"; estado.respuesta = null; estado.acepta = false; pintar(true); return; }
  const en = t.closest("[data-encuesta]");
  if (en){ estado.encuesta = en.dataset.encuesta; estado.vista = "encuesta"; estado.borrador = {}; pintar(true); return; }
  const op = t.closest("[data-op]");
  if (op){ estado.respuesta = Number(op.dataset.op); pintar(); return; }
  const ac = t.closest("[data-acepta]");
  if (ac){ estado.acepta = !estado.acepta; pintar(); return; }
  const rp = t.closest("[data-resp]");
  if (rp){ estado.borrador[rp.dataset.resp] = rp.dataset.valor; pintar(); return; }
  const ed = t.closest("[data-editar]");
  if (ed){ tostada("Se abre el editor de la cápsula, con su contenido y su chequeo."); return; }
  const acc = t.closest("[data-accion]");
  if (acc) accion(acc.dataset.accion);
});
document.addEventListener("input", e => {
  const l = e.target.closest("[data-libre]");
  if (l) estado.borrador[l.dataset.libre] = l.value;
});

async function accion(cual){
  if (cual === "confirmar"){
    const k = CAPSULAS.find(x => x.id === estado.capsula);
    const bien = estado.respuesta === k.chequeo.ok;
    const respIdx = estado.respuesta;
    REGISTRO[k.id][YO] = "si";
    estado.vista = "capsulas"; pintar();
    tostada(bien ? "Confirmada. Queda registrada con fecha y hora."
                 : "Confirmada. La opción elegida no era la esperada; volvé al material cuando puedas.");
    const { error } = await sb.from('capsula_confirmaciones').upsert(
      { capsula_id:k.id, user_id:YO_ID, respuesta_index:respIdx, correcta:bien, confirmado_at:new Date().toISOString() },
      { onConflict:'capsula_id,user_id' }
    );
    if (error) tostada("No se pudo guardar en el servidor: " + error.message);
  }
  else if (cual === "enviar-encuesta"){
    const e = ENCUESTAS.find(x => x.id === estado.encuesta);
    const respuestas = { ...estado.borrador };
    e.respondida = true;
    estado.vista = "encuestas"; pintar();
    tostada("Respuestas enviadas. Se suman al total, sin tu nombre.");
    const { error } = await sb.from('encuesta_respuestas').insert({ encuesta_id:e.id, user_id:YO_ID, respuestas });
    if (error) tostada("No se pudo enviar: " + error.message);
  }
  else if (cual === "recordar"){ tostada("Recordatorio enviado solo a quienes no confirmaron."); }
  else if (cual === "exportar"){ tostada("Se descarga en planilla, con fecha y hora de cada confirmación."); }
  else if (cual === "capsulizar"){ tostada("Se arma un borrador de cápsula con lo que el equipo pidió. Coordinación lo revisa antes de publicar."); }
  else if (cual === "cerrar"){ cerrarModal(); }
  else if (cual === "nueva-capsula"){
    abrirModal(`
      <h2>Nueva cápsula</h2>
      <div class="sub">Material breve más una confirmación. Cuatro a siete minutos es el largo que la gente completa.</div>
      <div class="campo"><label for="c-tit">Título</label><input id="c-tit" placeholder="Ej.: Metas de comprensión"></div>
      <div class="campo"><label for="c-res">Resumen</label><input id="c-res" placeholder="Una línea, la que se ve en el fichero"></div>
      <div class="dupla">
        <div class="campo"><label for="c-tipo">Tipo</label>
          <select id="c-tipo"><option>EpC</option><option>Retroalimentación</option><option>Evaluación</option>
          <option>Acuerdo institucional</option><option>Gestión Ambiental</option><option>Protocolo</option></select></div>
        <div class="campo"><label for="c-min">Minutos</label><input id="c-min" type="number" value="5" min="1"></div>
      </div>
      <div class="campo"><label for="c-cuerpo">Contenido</label><textarea id="c-cuerpo" placeholder="El texto de la cápsula. Se puede sumar video y material adjunto."></textarea></div>
      <div class="campo"><label for="c-preg">Situación de chequeo</label><input id="c-preg" placeholder="Un caso a resolver, no una pregunta de memoria"></div>
      <div class="campo"><label for="c-pub">Se publica</label><input id="c-pub" type="date"></div>
      <div class="acciones"><button class="btn btn-p" data-accion="guardar-capsula">Publicar</button>
        <button class="btn btn-s" data-accion="cerrar">Cancelar</button></div>`);
  }
  else if (cual === "guardar-capsula"){
    const tit = $("#c-tit").value.trim();
    if (!tit){ tostada("Poné un título para publicarla."); $("#c-tit").focus(); return; }
    const fechaPub = $("#c-pub").value ? new Date($("#c-pub").value) : new Date();
    const registro = {
      titulo: tit,
      resumen: $("#c-res").value.trim() || "Sin resumen.",
      autor: YO_NOMBRE,
      tipo: $("#c-tipo").value,
      min_lectura: Number($("#c-min").value) || 5,
      cuerpo: [$("#c-cuerpo").value.trim() || "Contenido pendiente de carga."],
      recursos: [],
      chequeo: { p:$("#c-preg").value.trim() || "¿Leíste el material?", op:["Sí","No"], ok:0 },
      destinatarios: 'todos',
      publicado_en: fechaPub.toISOString(),
      futura: fechaPub.getTime() > Date.now()
    };
    cerrarModal();
    const { data, error } = await sb.from('capsulas').insert(registro).select().single();
    if (error){ tostada("No se pudo publicar: " + error.message); return; }
    CAPSULAS.push({ id:data.id, mes:new Date(data.publicado_en).getMonth(), titulo:data.titulo, resumen:data.resumen,
      autor:data.autor, min:data.min_lectura, tipo:data.tipo, cuerpo:data.cuerpo, recursos:data.recursos,
      chequeo:data.chequeo, futura:data.futura, publicado_en:data.publicado_en, plazo_dias:data.plazo_dias });
    REGISTRO[data.id] = {};
    estado.vista = "biblioteca"; pintar();
    tostada("Cápsula publicada. El equipo ya la ve en su fichero.");
  }
  else if (cual === "nueva-encuesta"){
    abrirModal(`
      <h2>Nueva encuesta</h2>
      <div class="sub">Misma mecánica que una cápsula, sin material adelante. Las respuestas llegan agregadas.</div>
      <div class="campo"><label for="e-tit">Título</label><input id="e-tit" placeholder="Ej.: Clima de trabajo · corte de mitad de año"></div>
      <div class="campo"><label for="e-p1">Pregunta 1 · escala de 1 a 5</label><input id="e-p1" placeholder="¿Cómo calificarías…?"></div>
      <div class="campo"><label for="e-p2">Pregunta 2 · opción múltiple</label><input id="e-p2" placeholder="¿Qué necesitás con más urgencia?"></div>
      <div class="dupla">
        <div class="campo"><label for="e-p2-op1">Opción 1</label><input id="e-p2-op1" placeholder="Ej.: Más tiempo de planificación"></div>
        <div class="campo"><label for="e-p2-op2">Opción 2</label><input id="e-p2-op2" placeholder="Ej.: Recursos materiales"></div>
      </div>
      <div class="dupla">
        <div class="campo"><label for="e-p2-op3">Opción 3</label><input id="e-p2-op3" placeholder="Opcional"></div>
        <div class="campo"><label for="e-p2-op4">Opción 4</label><input id="e-p2-op4" placeholder="Opcional"></div>
      </div>
      <div class="campo"><label for="e-p3">Pregunta 3 · respuesta abierta</label><input id="e-p3" placeholder="Una cosa que cambiarías…"></div>
      <div class="campo"><label for="e-cierre">Cierra el</label><input id="e-cierre" type="date"></div>
      <div class="acciones"><button class="btn btn-p" data-accion="guardar-encuesta">Publicar</button>
        <button class="btn btn-s" data-accion="cerrar">Cancelar</button></div>`);
  }
  else if (cual === "guardar-encuesta"){
    const tit = $("#e-tit").value.trim();
    if (!tit){ tostada("Poné un título para publicarla."); $("#e-tit").focus(); return; }
    const opciones = ["#e-p2-op1","#e-p2-op2","#e-p2-op3","#e-p2-op4"]
      .map(sel => $(sel).value.trim()).filter(Boolean);
    if (opciones.length < 2){ tostada("Cargá al menos dos opciones para la pregunta 2."); $("#e-p2-op1").focus(); return; }
    const registro = {
      titulo: tit,
      preguntas: [
        { t:"escala", p:$("#e-p1").value.trim() || "Valorá del 1 al 5", min:1, max:5 },
        { t:"opciones", p:$("#e-p2").value.trim() || "Elegí una opción", op:opciones },
        { t:"abierta", p:$("#e-p3").value.trim() || "Comentarios" }
      ],
      abierta: true,
      cierra_en: $("#e-cierre").value ? new Date($("#e-cierre").value).toISOString() : null
    };
    cerrarModal();
    const { data, error } = await sb.from('encuestas').insert(registro).select().single();
    if (error){ tostada("No se pudo publicar: " + error.message); return; }
    ENCUESTAS.unshift({ id:data.id, titulo:data.titulo, preguntas:data.preguntas, abierta:data.abierta,
      cierra:"Abierta", cierra_en:data.cierra_en, respondida:false });
    RESULTADOS_ENCUESTA[data.id] = { totalRespondidas:0, preguntas:data.preguntas.map(q => q.t==='abierta' ? {tipo:'abierta',pregunta:q.p,citas:[]} : {tipo:q.t,pregunta:q.p,barras:[]}) };
    pintar();
    tostada("Encuesta publicada. El equipo ya la ve.");
  }
}

/* ═══════════════════════════════════════════════
   ACCESO
   ═══════════════════════════════════════════════ */
function mostrarLogin(){
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'none';
}

async function entrar(session){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('loading-screen').style.display = 'flex';
  YO_EMAIL = session.user.email;
  YO_ID = session.user.id;
  YO_NOMBRE = nombreDeEmail(YO_EMAIL);
  YO = YO_EMAIL;

  await cargarDatos();

  PERFIL = {
    docente: { nom:YO_NOMBRE, det:"Docente · Austin", av:iniciales(YO_NOMBRE) },
    coordinacion: { nom:YO_NOMBRE, det:"Coordinación", av:iniciales(YO_NOMBRE) }
  };
  document.getElementById('rolcambio').innerHTML = esCoordinador
    ? '<button data-rol="docente">Docente</button><button data-rol="coordinacion">Coordinación</button>'
    : '';
  estado.rol = "docente"; estado.vista = "capsulas";
  if (esCoordinador && new URLSearchParams(location.search).get('vista') === 'coordinacion'){
    estado.rol = "coordinacion"; estado.vista = "biblioteca";
  }

  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  pintar(true);
}

async function iniciarSesion(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const msg = document.getElementById('login-msg');
  msg.className = 'login-msg';
  if (!email || !pass){ msg.textContent = 'Completá email y contraseña.'; msg.className = 'login-msg error'; return; }
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Ingresando…';
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  btn.disabled = false; btn.textContent = 'Ingresar';
  if (error){ msg.textContent = 'Email o contraseña incorrectos.'; msg.className = 'login-msg error'; }
}

document.getElementById('login-btn').addEventListener('click', iniciarSesion);
document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') iniciarSesion(); });
document.getElementById('logout-btn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

let sesionVerificada = false;
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT'){ sesionVerificada = false; return; }
  if (session && !sesionVerificada){ sesionVerificada = true; entrar(session); }
});

(async function iniciar(){
  const { data:{ session } } = await sb.auth.getSession();
  if (session){ sesionVerificada = true; entrar(session); } else { mostrarLogin(); }
})();
</script>
