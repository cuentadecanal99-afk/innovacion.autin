<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Generator | Austin EBS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --austin-blue: #1a2e5a;
            --austin-red: #8b1d22;
            --austin-light-blue: #e8ecf3;
            --austin-gray: #f8f9fa;
            --white: #ffffff;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background-color: var(--austin-gray); 
            margin: 0; padding: 40px 20px; 
            color: #333;
            display: flex; justify-content: center; 
        }

        .container { 
            width: 100%; max-width: 1000px; 
            background: var(--white); padding: 40px; 
            border-radius: 12px; border-top: 12px solid var(--austin-blue); 
            box-shadow: var(--shadow); box-sizing: border-box;
        }

        header { border-bottom: 2px solid var(--austin-red); margin-bottom: 30px; padding-bottom: 15px; }
        h1 { color: var(--austin-blue); margin: 0; font-size: 1.5rem; text-transform: uppercase; font-weight: 800; }

        .grid-config {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group { display: flex; flex-direction: column; }
        label { font-weight: 700; margin-bottom: 8px; color: var(--austin-blue); font-size: 0.75rem; text-transform: uppercase; }
        
        select, textarea { 
            width: 100%; padding: 12px; border: 2px solid var(--austin-light-blue); 
            border-radius: 6px; font-size: 0.95rem; box-sizing: border-box; 
            outline: none; transition: var(--transition);
        }
        select:focus, textarea:focus { border-color: var(--austin-blue); }
        textarea { height: 160px; line-height: 1.5; }

        button { 
            background-color: var(--austin-red); color: white; 
            padding: 16px; border: none; border-radius: 6px; 
            cursor: pointer; font-weight: 700; width: 100%;
            font-size: 1rem; text-transform: uppercase; letter-spacing: 1px;
            transition: var(--transition);
        }
        button:hover { background-color: var(--austin-blue); }
        button:disabled { background-color: #cbd5e0; cursor: not-allowed; }

        .output-wrapper {
            margin-top: 35px;
            background: #1e293b; 
            padding: 25px;
            border-radius: 8px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .output-header label { color: #94a3b8; }

        .btn-copy {
            background-color: var(--austin-blue);
            padding: 6px 15px;
            font-size: 0.8rem;
            width: auto;
            border-radius: 4px;
        }

        #output-box { 
            width: 100%; min-height: 250px; 
            background-color: #0f172a; 
            padding: 20px; 
            border: 1px solid #334155;
            border-radius: 6px; 
            box-sizing: border-box; 
            overflow-wrap: break-word; 
            white-space: pre-wrap; 
            outline: none;
            line-height: 1.6; 
            color: #cbd5e1; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 0.95rem;
        }

        @media (max-width: 1024px) {
            .container {
                padding: 32px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 24px 14px;
            }

            .container {
                padding: 24px;
                border-radius: 8px;
            }

            .grid-config {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.35rem;
            }

            .output-wrapper {
                padding: 20px;
            }

            #output-box {
                min-height: 240px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>AI Prompt Generator para Adaptaciones</h1>
    </header>

    <div class="grid-config">
        <div class="form-group">
            <label for="perfil">Perfil del Alumno</label>
            <select id="perfil">
                <option value="fonologico">Dislexia Leve (Fonológica)</option>
                <option value="superficial">Dislexia Severa (Superficial)</option>
                <option value="tea">TEA (Literalidad y Estructura)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="idioma">Idioma</label>
            <select id="idioma" onchange="actualizarNiveles()">
                <option value="es">Castellano (L1)</option>
                <option value="en">Inglés (L2)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="nivel">Complejidad Cognitiva</label>
            <select id="nivel">
                </select>
        </div>
    </div>

    <div class="form-group" style="margin-bottom: 25px;">
        <label for="actividad">Actividad Original</label>
        <textarea id="actividad" placeholder="Pegue el contenido o consignas de la clase aquí..."></textarea>
    </div>

    <button id="btn-generar" onclick="construirPrompt()">CONSTRUIR PROMPT PARA GEMINI</button>

    <div class="output-wrapper">
        <div class="output-header">
            <label>Prompt Final Configurado</label>
            <button class="btn-copy" onclick="copiarAlPortapapeles()">Copiar Prompt</button>
        </div>
        <div id="output-box" contenteditable="false">Complete los campos de arriba y presione el botón para generar el prompt...</div>
    </div>
</div>

<script>
    // --- CONFIGURACIÓN CONEXIÓN REAL SUPABASE ---
    const SUPABASE_URL = 'https://kretfnbddhbosacfgdup.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtyZXRmbmJkZGhib3NhY2ZnZHVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0Mjk3MTcsImV4cCI6MjA4NzAwNTcxN30.P0HLqGab3tB5WdsVGYKXEyK572JvthHYFg7iu3MJpgo';      
    
    let supabaseClient = null;
    try {
        if (SUPABASE_URL.startsWith('http')) {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } else {
            console.error("SUPABASE_URL inválida.");
        }
    } catch (e) {
        console.error("Error al inicializar el cliente de Supabase:", e);
    }

    const niveles = {
        es: [
            { val: "alfab_inicial", lab: "Alfabetización Inicial" },
            { val: "lector_fluido", lab: "Lectura Fluida / Consolidada" },
            { val: "informativo", lab: "Texto Informativo / Secundaria" },
            { val: "academico", lab: "Texto Académico / Superior" }
        ],
        en: [
            { val: "pre_a1", lab: "Pre-A1 (Starters/Kids)" },
            { val: "a1_a2", lab: "A1/A2 (Movers/Key)" },
            { val: "b1", lab: "B1 (Intermediate/PET)" },
            { val: "b2", lab: "B2 (Upper-Int/FCE)" }
        ]
    };

    function actualizarNiveles() {
        const idioma = document.getElementById('idioma').value;
        const selectorNivel = document.getElementById('nivel');
        if (!selectorNivel) return;

        selectorNivel.innerHTML = "";
        niveles[idioma].forEach(n => {
            let opt = document.createElement('option');
            opt.value = n.val;
            opt.innerHTML = n.lab;
            selectorNivel.appendChild(opt);
        });
    }

    document.addEventListener("DOMContentLoaded", function() {
        actualizarNiveles();
    });

    async function copiarAlPortapapeles() {
        const box = document.getElementById('output-box');
        const btn = document.querySelector('.btn-copy');
        
        // Validación simplificada para permitir copias efectivas
        if (box.innerText.includes("Complete los campos de arriba")) {
            alert("Primero debes generar el prompt.");
            return;
        }

        try {
            await navigator.clipboard.writeText(box.innerText);
            const originalText = btn.innerText;
            btn.innerText = "¡COPIADO!";
            btn.style.backgroundColor = "#28a745";
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.backgroundColor = "var(--austin-blue)";
            }, 1500);
        } catch (err) {
            // Fallback para entornos de desarrollo locales sin SSL (HTTP)
            const textArea = document.createElement("textarea");
            textArea.value = box.innerText;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                btn.innerText = "¡COPIADO!";
                btn.style.backgroundColor = "#28a745";
                setTimeout(() => {
                    btn.innerText = "Copiar Prompt";
                    btn.style.backgroundColor = "var(--austin-blue)";
                }, 1500);
            } catch (fallbackErr) {
                alert("Error al copiar. Selecciona el texto manualmente.");
            }
            document.body.removeChild(textArea);
        }
    }

    async function construirPrompt() {
        const btn = document.getElementById('btn-generar');
        const output = document.getElementById('output-box');
        
        const perfilSlug = document.getElementById('perfil').value;
        const idiomaCode = document.getElementById('idioma').value; 
        const selectorNivel = document.getElementById('nivel');
        
        if (!selectorNivel || selectorNivel.options.length === 0) {
            alert("Error en la interfaz: los niveles no están cargados.");
            return;
        }
        
        const nivelSlug = selectorNivel.value; 
        const nivelLabel = selectorNivel.options[selectorNivel.selectedIndex].text;
        const textoOriginal = document.getElementById('actividad').value;

        if (!textoOriginal) {
            alert("Por favor, ingresa el texto de la actividad primero.");
            return;
        }

        try {
            btn.disabled = true;
            output.innerText = "Consultando matrices técnicas en Supabase...";

            const [resPerfil, resNivel] = await Promise.all([
                supabaseClient.from('perfiles_dislexia').select('lineamientos').eq('perfil_slug', perfilSlug),
                supabaseClient.from('niveles_idioma').select('descripcion_tecnica').eq('idioma_code', idiomaCode).eq('nivel_slug', nivelSlug)
            ]);

            if (resPerfil.error) throw resPerfil.error;
            if (resNivel.error) throw resNivel.error;

            if (!resPerfil.data || resPerfil.data.length === 0) {
                output.innerText = `Error: No se encontró el perfil psicopedagógico '${perfilSlug}'.`;
                return;
            }

            const perfil = resPerfil.data[0].lineamientos;
            const idiomaText = idiomaCode === 'es' ? 'Castellano (Español)' : 'Inglés (English)';
            
          let matrizNivel = null;
            if (resNivel.data && resNivel.data.length > 0) {
                matrizNivel = resNivel.data[0].descripcion_tecnica;
            }

            output.innerText = "Estructurando prompt...";
            const promptFinal = `Actúa como un Diseñador de Experiencias de Aprendizaje (LX Designer) senior, especialista en Diseño Universal para el Aprendizaje (DUA), neurodiversidad y diseño de materiales de evaluación para exámenes internacionales. 

Tu tarea no es resumir ni infantilizar el texto original, sino realizar una TRANSPOSICIÓN DIDÁCTICA PROFESIONAL aplicando andamiaje cognitivo estricto.

[MATERIA PRIMA - ALCANCE LINGÜÍSTICO]
- IDIOMA OBJETIVO: ${idiomaText}
- NIVEL OBJETIVO: ${nivelLabel}
- VOCABULARIO PERMITIDO: ${matrizNivel ? matrizNivel.vocabulario : 'Vocabulario estándar del nivel.'}
- GRAMÁTICA PERMITIDA: ${matrizNivel ? matrizNivel.gramatica : 'Gramática estándar del nivel.'}
- RESTRICCIÓN LINGÜÍSTICA: ${matrizNivel ? matrizNivel.restriccion : 'Sin restricciones adicionales.'}

[RESTRICCIONES DURAS DE ACCESIBILIDAD COGNITIVA]
Aplica con máxima jerarquía los lineamientos del perfil del alumno (${perfil.nombre || 'Perfil Seleccionado'}):
- VISUAL: ${perfil.visual}
- SINTAXIS: ${perfil.sintaxis}
- LÉXICO: ${perfil.lexico}
- INSTRUCCIONES: ${perfil.instrucciones}

[METODOLOGÍA DOCENTE Y RECURSOS CREATIVOS OBLIGATORIOS]
Para evitar salidas repetitivas y garantizar rigor pedagógico, estructura la entrega final siguiendo estrictamente esta arquitectura de información:

1. GLOSARIO DE ANCLAJE (Soporte Léxico previo):
Antes del texto principal, extrae hasta 3 conceptos técnicos indispensables del texto original (ej. nombres históricos, procesos científicos) que superen el nivel del alumno o impliquen abstracción. Defínelos usando lenguaje 100% denotativo, concreto y aplicando la regla visual del perfil.

2. TEXTO ADAPTADO POR SEGMENTACIÓN (Chunking):
Divide el texto original en bloques informativos independientes. Cada bloque debe tener unaximo de 3 oraciones que respeten la restricción sintáctica del perfil. Separa cada bloque con una línea divisoria clara. No elimines los datos esenciales, fechas o nombres requeridos para los objetivos de aprendizaje; reestructúralos linealmente.

3. DIVERSIFICACIÓN DE LA ACTIVIDAD (Diseño de Tarea Única):
Analiza el objetivo de evaluación del texto original. Selecciona EXCLUSIVAMENTE UNO de los siguientes tres formatos didácticos para evaluar toda la comprensión del texto. Queda TERMINANTEMENTE PROHIBIDO incluir los tres formatos juntos; elige solo el que mejor se adapte al tipo de contenido original y desarrolla la actividad bajo esa única modalidad:
- Opción A (Comprensión de detalles): Un único formato 'Cloze' (Texto con lagunas) con su Word Bank.
- Opción B (Clasificación lógica): Una única tarea de categorización por listas (clasificar elementos o causas/consecuencias).
- Opción C (Verificación literal): Un único bloque de enunciados directos para marcar como Right o Wrong (máximo 4 enunciados).
[RESTRICCIONES CRÍTICAS DE CONTROL]
- Devuelve DIRECTAMENTE la experiencia de aprendizaje adaptada y maquetada según las reglas visuales. No agregues prefacios, introducciones, saludos ni justificaciones metodológicas orientadas al docente. El output debe estar listo para el alumno.

========================================
TEXTO ORIGINAL A ADAPTAR:
========================================
${textoOriginal}`;

            output.innerText = promptFinal.trim();

        } catch (err) {
            console.error(err);
            output.innerText = "Error: " + err.message;
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
