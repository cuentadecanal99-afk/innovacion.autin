<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUD Developer | Austin Eco Bilingual School</title>
    <style>
        :root {
            --primary-bg: #2c3e50;
            --panel-bg: #ecf0f1;
            --sidebar-width: 300px;
            --accent-green: #27ae60;
            --border-color: #bdc3c7;
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            background: #fff; 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
        }

        header { 
            background: var(--primary-bg); 
            color: white; 
            padding: 10px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .dashboard {
            display: grid;
            grid-template-columns: var(--sidebar-width) 1fr;
            flex-grow: 1;
            overflow: hidden;
        }

        /* SIDEBAR: flex column con scroll en la zona de campos, botones fijos al fondo */
        .sidebar {
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Zona scrolleable dentro del sidebar */
        .sidebar-fields {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Zona de botones fija al fondo del sidebar */
        .sidebar-actions {
            padding: 16px 20px;
            border-top: 1px solid var(--border-color);
            background: var(--panel-bg);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-actions button {
            width: 100%;
            padding: 12px 16px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 0.9rem;
        }

        .btn-pdf {
            background-color: #7f8c8d;
            color: white;
        }

        .btn-guardar {
            background-color: #1a472a;
            color: white;
        }

        .main-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            position: relative;
        }

        .field-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-weight: bold; font-size: 0.9rem; color: #555; }
        .required { color: #e74c3c; font-weight: bold; }
        .optional { color: #95a5a6; font-size: 0.75rem; font-weight: normal; }
        input, textarea { 
            border: 1px solid var(--border-color); 
            border-radius: 4px; 
            padding: 10px; 
            font-size: 14px;
        }

        .style-orientation {
            border-left: 4px solid #3498db;
            background: #e1f5fe;
            height: 120px;
        }

        .content-area { height: 250px; }

        .btn-generate {
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 15px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
        }

        #output-preview {
            border: 2px dashed var(--border-color);
            min-height: 400px;
            background: white;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .project-box {
            border: 2px solid #e67e22;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #fffaf5;
        }

        .box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .box-header label {
            color: #a35200;
            font-weight: bold;
        }

        .badge-ia {
            background-color: #fce4cc;
            color: #d35400;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        #proyecto-final {
            width: 100%;
            height: 100px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: none;
            box-sizing: border-box; 
            display: block;
        }

        /* REGLAS CRÍTICAS DE IMPRESIÓN Y CONTROL DE HOJAS PROLIJAS */
        @media print {
            header, .sidebar, .field-group, .project-box, button, #btn-generar, .btn-generate, style, script, .badge-ia {
                display: none !important;
            }
            
            #output-preview {
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
                background: white !important;
            }

            .dashboard {
                display: block !important;
            }
            
            body, .main-content {
                background: white !important;
                overflow: visible !important;
                height: auto !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            /* Forzar a que las filas de tablas no se fracturen horizontalmente */
            table tr {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            /* Impedir que los separadores de secciones queden colgados al final de una página */
            .pud-section-title {
                page-break-after: avoid !important;
                break-after: avoid !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            table {
                page-break-inside: auto !important;
            }
        }
    </style>
</head>
<body>

    <header>
        <div>PUD Developer | EpC Framework</div>
        <div style="font-size: 0.8rem; opacity: 0.7;">Modo: Datos Puros (Lean Tokens)</div>
    </header>

    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-fields">
                <div class="field-group">
                    <label>Año <span class="required">*</span></label>
                    <input type="text" id="unit_year" placeholder="Ej: 6to Primaria">
                </div>
                <div class="field-group">
                    <label>Nombre de la Unidad <span class="optional">(opcional)</span></label>
                    <input type="text" id="unit_name" placeholder="Ej: Journey of our Food">
                </div>
                <div class="field-group">
                    <label>Materia <span class="required">*</span></label>
                    <input type="text" id="subject" placeholder="Ej: English / Global Perspectives">
                </div>
                <div class="field-group">
                    <label>Orientación Pedagógica <span class="required">*</span></label>
                    <textarea id="orientation" class="style-orientation" placeholder="Define tu tono pedagógico..."></textarea>
                </div>
            </div>

            <div class="sidebar-actions">
                <button class="btn-pdf" id="btn-pdf" onclick="exportarPDF()">📄 Descargar PDF</button>
                <button class="btn-guardar" id="btn-guardar" onclick="guardarPlanificacion()">💾 Guardar en Historial</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="field-group">
                <label>Contenido de la Unidad</label>
                <textarea id="raw_input" class="content-area" placeholder="Vuelque aquí los conceptos clave..."></textarea>
            </div>

            <div class="input-group project-box">
                <div class="box-header">
                    <label>Proyecto Final (Opcional)</label>
                    <span class="badge-ia">IA GENERATED</span>
                </div>
                <textarea id="proyecto-final" placeholder="Desempeño final..."></textarea>
            </div>

            <button class="btn-generate" id="btn-generar">Generar Prompt Estructurado</button>

            <div id="output-preview" contenteditable="true">
                <p style="text-align:center; color:#999; margin-top: 150px;">
                    Presioná el botón, copiá el prompt estructurado, pegalo en Gemini, y cuando responda, pegá el JSON acá.
                </p>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        const renderAustinPUD = (data) => {
            const hilosHtml = data.throughlines.map(h => `${h}<br>`).join('');
            
            const metasHtml = data.understanding_goals.map(ug => `
                <tr>
                    <td style="border: 1pt solid #000; padding: 10px; width: 55%;"><strong>${ug.id}:</strong> ${ug.text}</td>
                    <td style="border: 1pt solid #000; padding: 10px; width: 15%; text-align: center; font-weight: bold; background-color: #f1f8e9;">${ug.dimension}</td>
                    <td style="border: 1pt solid #000; padding: 10px;">${ug.question}</td>
                </tr>
            `).join('');

            const desempenosHtml = data.performances.map(p => `
                <tr>
                    <td style="border: 1pt solid #000; padding: 10px;">
                        <strong>${p.title}:</strong> ${p.description}<br><strong>Assessment:</strong> ${p.assessment}
                    </td>
                    <td style="border: 1pt solid #000; text-align: center;">${p.ug}</td>
                    <td style="border: 1pt solid #000; text-align: center;">${p.upt}</td>
                    <td style="border: 1pt solid #000; text-align: center;">${p.mi}</td>
                    <td style="border: 1pt solid #000; text-align: center;">${p.td}</td>
                </tr>
            `).join('');

            return `
            <div style="font-family: 'Arial', sans-serif; max-width: 850px; margin: auto; border: 1.5pt solid #000; padding: 0; background-color: white; color: black; text-align: left;">
                <table style="width: 100%; border-collapse: collapse; border-bottom: 2pt solid #000;">
                    <tr>
                        <td style="width: 20%; padding: 15px; text-align: center;">
                            <div class="logo-container" style="width: 80px; height: 80px; display: flex; align-items: center; justify-content: center;">
                                <img src="austin-eco-bilingual-school-campana-argentina.jpg" alt="Austin Eco Bilingual School" style="max-width: 100%; max-height: 100%; object-fit: contain;">
                            </div>
                        </td>
                        <td style="width: 80%; padding: 15px; text-align: right;">
                            <span style="font-size: 16pt; font-weight: bold; color: #1a472a;">AUSTIN ECO BILINGUAL SCHOOL</span><br>
                            <span style="font-size: 10pt; letter-spacing: 1px;">PLANIFICADOR DE UNIDAD DIDÁCTICA (PUD)</span><br>
                            <span style="font-size: 9pt; font-style: italic;">"Developing global citizens for a sustainable future"</span>
                        </td>
                    </tr>
                </table>

                <table style="width: 100%; border-collapse: collapse;">
                    <tr style="font-size: 10pt;">
                        <td style="padding: 8px; border: 1pt solid #000; width: 15%;"><strong>AÑO :</strong></td>
                        <td id="render-year" style="padding: 8px; border: 1pt solid #000; width: 35%;" contenteditable="true">${data.meta.year || ''}</td>
                        <td style="padding: 8px; border: 1pt solid #000; width: 15%;"><strong>SECCIÓN :</strong></td>
                        <td id="render-section" style="padding: 8px; border: 1pt solid #000; width: 35%;" contenteditable="true">${data.meta.section || ''}</td>
                    </tr>
                    <tr style="font-size: 10pt;">
                        <td style="padding: 8px; border: 1pt solid #000;"><strong>MATERIA :</strong></td>
                        <td id="render-subject" style="padding: 8px; border: 1pt solid #000;">${data.meta.subject || ''}</td>
                        <td style="padding: 8px; border: 1pt solid #000;"><strong>DOCENTE :</strong></td>
                        <td id="render-docente" style="padding: 8px; border: 1pt solid #000;" contenteditable="true" placeholder="Escriba su nombre aquí..."></td>
                    </tr>
                </table>

                <div class="pud-section-title" style="background-color: #e8f5e9; padding: 10px; font-weight: bold; border-top: 1pt solid #000; border-bottom: 1pt solid #000; font-size: 11pt; color: #2e7d32;">THROUGHLINES:</div>
                <div style="padding: 15px; border-bottom: 1pt solid #000; font-size: 10.5pt; line-height: 1.6;">
                    ${hilosHtml}
                </div>

                <div class="pud-section-title" style="background-color: #e8f5e9; padding: 10px; font-weight: bold; border-bottom: 1pt solid #000; font-size: 11pt; color: #2e7d32;">TOPIC:</div>
                <div style="padding: 20px; border-bottom: 1pt solid #000; text-align: center; font-size: 14pt; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">
                    "${data.topic}"
                </div>

                <div class="pud-section-title" style="background-color: #e8f5e9; padding: 10px; font-weight: bold; border-bottom: 1pt solid #000; font-size: 11pt; color: #2e7d32;">UNDERSTANDING GOALS:</div>
                <table style="width: 100%; border-collapse: collapse; font-size: 10pt;">
                    ${metasHtml}
                </table>

                <div class="pud-section-title" style="background-color: #e0e0e0; padding: 10px; font-weight: bold; border-top: 1pt solid #000; border-bottom: 1pt solid #000; font-size: 11pt;">PERFORMANCES AND ASSESSMENT:</div>
                <table style="width: 100%; border-collapse: collapse; font-size: 9pt;">
                    <tr style="background-color: #f2f2f2; font-weight: bold; text-align: center; break-inside: avoid;">
                        <td style="border: 1pt solid #000; padding: 8px;">Understanding Performances + Assessment</td>
                        <td style="border: 1pt solid #000; width: 40px;">UG</td>
                        <td style="border: 1pt solid #000; width: 40px;">UPT</td>
                        <td style="border: 1pt solid #000; width: 50px;">MI</td>
                        <td style="border: 1pt solid #000; width: 60px;">TD</td>
                    </tr>
                    ${desempenosHtml}
                    <tr style="background-color: #fff9c4; break-inside: avoid;">
                        <td style="border: 1pt solid #000; padding: 10px;">
                            <strong>FINAL PROJECT: ${data.final_project.title}</strong><br>
                            ${data.final_project.description}
                        </td>
                        <td style="border: 1pt solid #000; text-align: center;">All</td>
                        <td style="border: 1pt solid #000; text-align: center;">PF</td>
                        <td style="border: 1pt solid #000; text-align: center;">${data.final_project.mi}</td>
                        <td style="border: 1pt solid #000; text-align: center;">${data.final_project.td}</td>
                    </tr>
                </table>

                <div style="padding: 15px; border-top: 1.5pt solid #000; font-size: 8.5pt; color: #444; text-align: center; break-inside: avoid;">
                    <strong>AUSTIN ECO BILINGUAL SCHOOL</strong> | <i>Academic Excellence & Global Sustainability</i><br>
                    Campana, Prov. de Buenos Aires | 2026
                </div>
            </div>`;
        };

        const SUPABASE_URL = 'https://kretfnbddhbosacfgdup.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtyZXRmbmJkZGhib3NhY2ZnZHVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0Mjk3MTcsImV4cCI6MjA4NzAwNTcxN30.P0HLqGab3tB5WdsVGYKXEyK572JvthHYFg7iu3MJpgo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const btn = document.getElementById('btn-generar');
        const preview = document.getElementById('output-preview');

     function prepararPromptParaIA(datosUsuario) {
    
    // Detección automática de idioma basada en la materia (insensible a mayúsculas/minúsculas)
    const materiaLower = datosUsuario.subject.toLowerCase();
    const keywordsIngles = ['english', 'global', 'science', 'math', 'art', 'history', 'geography', 'bilingual', 'perspectives'];
    
    // Si la materia incluye alguna palabra clave, se fuerza inglés. Si no, español.
    const esIngles = keywordsIngles.some(keyword => materiaLower.includes(keyword));
    
    // Configuración dinámica de instrucciones según el idioma detectado
    const idiomaInstruccion = esIngles 
        ? `CRITERIO DE IDIOMA Y REDACCIÓN OBLIGATORIO:
Todas las variables de texto didáctico (topic, throughlines, text, question, title, description, assessment) DEBEN ser redactadas exclusivamente en INGLÉS.
Además, todas las metas de comprensión ('text' dentro de 'understanding_goals') DEBEN comenzar obligatoriamente con la frase exacta: "Students will develop understanding about..." seguido del desarrollo pedagógico.`
        : `CRITERIO DE IDIOMA Y REDACCIÓN OBLIGATORIO:
Todas las variables de texto didáctico (topic, throughlines, text, question, title, description, assessment) DEBEN ser redactadas exclusivamente en ESPAÑOL.
Además, todas las metas de comprensión ('text' dentro de 'understanding_goals') DEBEN comenzar obligatoriamente con la frase exacta: "Los estudiantes desarrollarán comprensión sobre..." seguido del desarrollo pedagógico.`;

    const ejemploMeta = esIngles ? "Students will develop understanding about..." : "Los estudiantes desarrollarán comprensión sobre...";
    
    return `Actúa como experto en EpC (Harvard Project Zero) para Austin Eco Bilingual School.
Genera la planificación solicitada siguiendo estrictamente el siguiente esquema de datos en formato JSON puro. No agregues explicaciones, markdown ni bloques de código redundantes, solo el objeto JSON estructurado.

${idiomaInstruccion}

DATOS DE ENTRADA:
- Unidad: ${datosUsuario.unit_name || "Sin nombre"}
- Materia: ${datosUsuario.subject}
- Año: ${datosUsuario.year}
- Enfoque Pedagógico: ${datosUsuario.orientation}
- Contenidos base: ${datosUsuario.raw_input}

ESTRUCTURA JSON REQUERIDA DE SALIDA:
{
  "meta": {
    "year": "${datosUsuario.year}",
    "section": "",
    "subject": "${datosUsuario.subject}"
  },
  "topic": "Título de la unidad optimizado",
  "throughlines": [
    "Pregunta de hilo conductor 1 (UG 1)?",
    "Pregunta de hilo conductor 2 (UG 2)?",
    "Pregunta de hilo conductor 3 (UG 3)?",
    "Pregunta de hilo conductor 4 (UG 4)?"
  ],
  "understanding_goals": [
    { "id": "UG 1", "text": "${ejemploMeta}", "dimension": "KNOWLEDGE", "question": "Pregunta guía" },
    { "id": "UG 2", "text": "${ejemploMeta}", "dimension": "METHOD", "question": "Pregunta guía" },
    { "id": "UG 3", "text": "${ejemploMeta}", "dimension": "PURPOSE", "question": "Pregunta guía" },
    { "id": "UG 4", "text": "${ejemploMeta}", "dimension": "COMMUNICATION", "question": "Pregunta guía" }
  ],
  "performances": [
    {
      "title": "Nombre de actividad 1",
      "description": "Detalle didáctico",
      "assessment": "Criterio de evaluación explícito",
      "ug": "1, 2",
      "upt": "GI",
      "mi": "L, Inter",
      "td": "3"
    }
  ],
  "final_project": {
    "title": "Nombre del Proyecto Final",
    "description": "Detalle del proyecto de síntesis",
    "mi": "L, V, N",
    "td": "7, 8"
  }
}

Genera exactamente 4 'understanding_goals' (repartiendo dimensiones entre KNOWLEDGE, METHOD, PURPOSE, COMMUNICATION) y al menos 4 'performances' articuladas.`;
}

        btn.addEventListener('click', async () => {
            const payload = {
                unit_name: document.getElementById('unit_name').value || "",
                subject: document.getElementById('subject').value || "",
                year: document.getElementById('unit_year').value || "",
                orientation: document.getElementById('orientation').value,
                raw_input: document.getElementById('raw_input').value,
                proyecto_final: document.getElementById('proyecto-final').value
            };

            if(!payload.year) return alert("El campo Año es obligatorio.");
            if(!payload.subject) return alert("El campo Materia es obligatorio.");
            if(!payload.orientation) return alert("El campo Orientación Pedagógica es obligatorio.");
            if(!payload.raw_input) return alert("El campo Contenido de la Unidad es obligatorio.");

            btn.innerText = "GENERANDO PROMPT...";
            btn.disabled = true;

            try {
                await _supabase.from('planificaciones_pud').insert([{ 
                    docente_nombre: '', 
                    topic_name: payload.unit_name,
                    raw_input: payload.raw_input,
                    proyecto_final: payload.proyecto_final,
                    status: 'pure_json_prompt_generated',
                    materia: payload.subject
                }]);

                const promptFinal = prepararPromptParaIA(payload);
                console.log("%c PROMPT DE DATOS PUROS PARA COPIAR:", "background: #27ae60; color: white; font-weight: bold; padding: 5px;");
                console.log(promptFinal);

                preview.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <h3 style="color: #27ae60;">¡Prompt de Estructura de Datos generado!</h3>
                        <p>Abrí la consola (<b>F12</b>), copiá el bloque y pegalo en Gemini.</p>
                        <p style="background:#f5f5f5; padding:10px; border-radius:4px; font-size:0.9rem;">Cuando la IA devuelva el JSON limpio, <b>pegá el texto directamente acá abajo</b> para renderizar la grilla.</p>
                        <button onclick="document.getElementById('output-preview').focus()" style="padding: 10px; cursor: pointer; background: #3498db; color:white; border:none; border-radius:4px;">Hacé clic acá antes de pegar</button>
                    </div>
                `;

                btn.innerText = "Generar otro Prompt";
                btn.disabled = false;

            } catch (err) {
                console.error("Error crítico:", err);
                btn.innerText = "Reintentar";
                btn.disabled = false;
            }
        });

        preview.addEventListener('paste', (e) => {
            e.preventDefault();
            let text = e.clipboardData.getData('text/plain');
            text = text.replace(/```json|```html|```/g, '').trim();

            try {
                const jsonData = JSON.parse(text);
                const htmlRenderizado = renderAustinPUD(jsonData);
                preview.innerHTML = htmlRenderizado;
            } catch (err) {
                console.error("Error al parsear el JSON de la IA:", err);
                alert("El contenido pegado no es un JSON válido. Asegurate de copiar solo el objeto estructurado devuelto por la IA.");
                preview.innerText = text;
            }
        });

        function exportarPDF() {
            const previewArea = document.getElementById('output-preview');

            if (!previewArea.innerHTML || previewArea.innerHTML.includes('Generar Prompt Estructurado') || previewArea.innerHTML.includes('¡Prompt de Estructura de Datos generado!')) {
                alert("Primero debes pegar el JSON de la IA para renderizar la grilla antes de exportar.");
                return;
            }
            window.print();
        }

        async function guardarPlanificacion() {
            const previewArea = document.getElementById('output-preview');
            
            if (!previewArea.innerHTML || previewArea.innerHTML.includes('Generar Prompt Estructurado') || previewArea.innerHTML.includes('¡Prompt de Estructura de Datos generado!')) {
                alert("Primero pegá el JSON de la IA para renderizar la grilla.");
                return;
            }

            // Capturar datos editados directamente de los ID asignados en la grilla renderizada
            const unitName = document.getElementById('unit_name').value;
            const subjectField = document.getElementById('render-subject');
            const subject = subjectField ? subjectField.innerText : document.getElementById('subject').value;
            const docenteField = document.getElementById('render-docente');
            const docenteNombre = docenteField ? docenteField.innerText.trim() : '';

            const data = {
                unit_name: unitName || "Sin título",
                subject: subject || "Sin materia",
                content_html: previewArea.innerHTML
            };

            try {
                // Guardar la planificación renderizada en la tabla de historial
                const { error: historyError } = await _supabase
                    .from('pud_history')
                    .insert([data]);

                if (historyError) throw historyError;

                // Si el docente completó su nombre en caliente, actualizamos el registro base de la traza original
                if (docenteNombre) {
                    await _supabase
                        .from('planificaciones_pud')
                        .update({ docente_nombre: docenteNombre })
                        .eq('topic_name', unitName)
                        .eq('materia', subject);
                }

                const btnGuardar = document.getElementById('btn-guardar');
                btnGuardar.innerText = "✅ ¡Guardado en Historial!";
                btnGuardar.style.backgroundColor = "#2e7d32";
                
                setTimeout(() => {
                    btnGuardar.innerText = "💾 Guardar en Historial";
                    btnGuardar.style.backgroundColor = "#1a472a";
                }, 3000);

            } catch (err) {
                console.error("Error de persistencia:", err);
                alert("Error al guardar: " + err.message);
            }
        }
    </script>
</body>
</html>
