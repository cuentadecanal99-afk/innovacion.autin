<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Tareas | Austin Eco</title>
    <link rel="icon" type="image/jpeg" href="austin-eco-bilingual-school-campana-argentina.jpg">
    <style>
        :root {
            --austin-blue: #1a2e5a;
            --austin-red: #8b1d22;
            --border: #e2e8f0;
            --surface: #f8f9fa;
            --white: #ffffff;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--surface);
            color: #333;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 860px;
            background: var(--white);
            border-radius: 10px;
            border-top: 10px solid var(--austin-blue);
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            padding: 24px;
        }

        header {
            border-bottom: 2px solid var(--austin-red);
            margin-bottom: 24px;
            padding-bottom: 14px;
        }
        header h1 {
            color: var(--austin-blue);
            font-size: 1.3rem;
            font-weight: 800;
            text-transform: uppercase;
            margin: 0;
        }
        header p { color: #64748b; font-size: 0.8rem; margin-top: 4px; }

        /* SELECCIÓN DE SECCIONES */
        .selection-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 14px;
        }
        .selection-card {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 7px 8px;
            background: var(--surface);
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 60px;
        }
        .selection-card:hover {
            border-color: var(--austin-blue);
            transform: translateY(-1px);
        }
        .selection-card.selected {
            border-color: var(--austin-blue);
            background: #eef4ff;
            box-shadow: 0 0 0 1px rgba(26, 46, 90, 0.1);
        }
        .selection-card input {
            margin-top: 2px;
            accent-color: var(--austin-blue);
            cursor: pointer;
            flex-shrink: 0;
        }
        .selection-card .card-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .selection-card .num {
            font-weight: 800;
            font-size: 0.7rem;
            color: var(--austin-blue);
        }
        .selection-card .name {
            font-weight: 700;
            color: #1e293b;
            line-height: 1.25;
            font-size: 0.66rem;
        }
        .selection-hint {
            margin-bottom: 16px;
            color: #64748b;
            font-size: 0.8rem;
            line-height: 1.4;
        }

        label {
            display: block;
            font-weight: 700;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--austin-blue);
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            border: 2px solid var(--border);
            border-radius: 5px;
            padding: 12px 14px;
            font-size: 0.92rem;
            font-family: inherit;
            color: #1e293b;
            resize: vertical;
            line-height: 1.6;
            transition: border-color 0.15s;
        }
        textarea:focus { outline: none; border-color: var(--austin-blue); }

        select {
            width: 100%;
            border: 2px solid var(--border);
            border-radius: 5px;
            padding: 10px 12px;
            font-size: 0.9rem;
            font-family: inherit;
            color: #1e293b;
            background: var(--white);
            outline: none;
            transition: border-color 0.15s;
        }
        select:focus { border-color: var(--austin-blue); }

        .optional-badge { text-transform: none; font-weight: 400; color: #94a3b8; }

        .campo-edad { max-width: 320px; margin-bottom: 18px; }

        button.btn-main {
            margin-top: 14px;
            background: var(--austin-red);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.btn-main:hover { background: var(--austin-blue); }

        .output-wrapper {
            margin-top: 28px;
            background: #1e293b;
            border-radius: 8px;
            padding: 22px;
        }
        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .output-header label { color: #94a3b8; margin: 0; }
        .btn-copy {
            background: var(--austin-blue);
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-copy:hover { background: #2563eb; }

        #output-box {
            width: 100%;
            min-height: 260px;
            background: #0f172a;
            color: #cbd5e1;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 18px;
            font-family: 'Courier New', monospace;
            font-size: 0.88rem;
            line-height: 1.7;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            resize: vertical;
        }

        @media (max-width: 960px) {
            .selection-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 620px) {
            .selection-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 380px) {
            .selection-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 700px) {
            body {
                padding: 18px 12px;
            }

            .container {
                padding: 18px;
                border-radius: 8px;
                box-shadow: none;
            }

            header h1 {
                font-size: 1.2rem;
            }

            textarea {
                min-height: 220px;
            }

            .output-wrapper {
                padding: 18px;
            }

            #output-box {
                min-height: 240px;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <header>
        <h1>Generador de Tareas</h1>
        <p>5 secciones estructuradas sobre el tema &nbsp;|&nbsp; Austin Eco Bilingual School</p>
    </header>

    <div id="del-pud" hidden></div>

    <div class="selection-hint">Marcá las secciones que querés incluir en la tarea. El prompt solo generará las que selecciones.</div>
    <div class="selection-grid" id="section-selector">
        <label class="selection-card selected">
            <input type="checkbox" class="section-toggle" value="1" checked>
            <span class="card-content">
                <span class="num">1</span>
                <span class="name">Texto informativo</span>
            </span>
        </label>
        <label class="selection-card selected">
            <input type="checkbox" class="section-toggle" value="2" checked>
            <span class="card-content">
                <span class="num">2</span>
                <span class="name">3 Preguntas cerradas</span>
            </span>
        </label>
        <label class="selection-card selected">
            <input type="checkbox" class="section-toggle" value="3" checked>
            <span class="card-content">
                <span class="num">3</span>
                <span class="name">3 Preguntas abiertas</span>
            </span>
        </label>
        <label class="selection-card selected">
            <input type="checkbox" class="section-toggle" value="4" checked>
            <span class="card-content">
                <span class="num">4</span>
                <span class="name">Actividad de vocabulario</span>
            </span>
        </label>
        <label class="selection-card selected">
            <input type="checkbox" class="section-toggle" value="5" checked>
            <span class="card-content">
                <span class="num">5</span>
                <span class="name">Clave de corrección</span>
            </span>
        </label>
    </div>

    <div class="form-group campo-edad">
        <label id="label-nivel" for="f-nivel">Edad / Grado del alumno <span class="optional-badge">(opcional)</span></label>
        <select id="f-nivel">
            <option value="">Sin especificar</option>
        </select>
    </div>

    <label for="f-tema">Tema o contenido de la tarea</label>
    <textarea id="f-tema" rows="6" placeholder="Describí el tema, unidad, concepto o contenido sobre el que querés generar la tarea. Podés incluir el año, materia o cualquier orientación específica..."></textarea>

    <button class="btn-main" onclick="construirPrompt()">Construir Prompt para Gemini</button>

    <div class="output-wrapper">
        <div class="output-header">
            <label>Prompt listo para copiar a Gemini</label>
            <button class="btn-copy" onclick="copiar()">Copiar Prompt</button>
        </div>
        <div id="output-box">Completá el campo de arriba y presioná el botón para generar el prompt...</div>
    </div>

</div>

<script src="nivel-inicial.js"></script>
<script src="pud-contexto.js"></script>
<script>
    // Niveles de calibración por idioma. Para inglés se usan los 6 niveles
    // MCER/CEFR (A1-C2); para castellano, los 6 grados de primaria como proxy
    // de edad cronológica (no aplica CEFR, que es un marco de lengua extranjera).
    // Mismo shape { label, vocabulario, gramatica } en ambos idiomas para que
    // bloqueBandaEdad sea una sola función.
    const NIVELES_EN = {
        A1: { label: 'A1 - Beginner', vocabulario: 'High-frequency, everyday words only (colors, family, routines, concrete objects). Avoid abstract terms.', gramatica: 'Present simple, regular plurals, sentences of 3-6 words. No compound tenses, no subordinate clauses.' },
        A2: { label: 'A2 - Elementary', vocabulario: 'Everyday vocabulary plus basic academic terms of the topic, always introduced with a concrete example.', gramatica: 'Past simple and "going to" future. Sentences of 6-9 words with simple connectors (and, but, because).' },
        B1: { label: 'B1 - Intermediate', vocabulario: 'Academic vocabulary of the topic, always introduced in context before being used freely.', gramatica: 'Present perfect, simple subordinate clauses, comparatives/superlatives. Sentences up to 12 words.' },
        B2: { label: 'B2 - Upper Intermediate', vocabulario: 'Academic and abstract vocabulary, including technical terms of the topic without needing translation.', gramatica: 'Passive voice, cause-effect connectors, conditional clauses. Sentences up to 15-18 words with subordination.' },
        C1: { label: 'C1 - Advanced', vocabulario: 'Advanced academic vocabulary, nuanced meaning, idiomatic collocations specific to the topic.', gramatica: 'Complex structures (mixed conditionals, passive voice across tenses), extended argumentation with contrast/qualification connectors.' },
        C2: { label: 'C2 - Proficient', vocabulario: 'Near-native register vocabulary, including connotative nuance and specialized terminology without simplification.', gramatica: 'Full command of complex, varied structures, sophisticated textual cohesion, precise rhetorical argumentation on abstract topics.' }
    };

    const NIVELES_ES = {
        '1° Grado Primaria': { label: '1° Grado Primaria', vocabulario: 'Cotidiano y muy concreto; evitar términos abstractos sin explicarlos primero.', gramatica: 'Oraciones de 4 a 6 palabras, una idea por oración, sin subordinadas.' },
        '2° Grado Primaria': { label: '2° Grado Primaria', vocabulario: 'Cotidiano, con primeras palabras específicas del área siempre acompañadas de un ejemplo concreto.', gramatica: 'Oraciones de 5 a 8 palabras, con conectores simples (y, pero, porque).' },
        '3° Grado Primaria': { label: '3° Grado Primaria', vocabulario: 'Específico del área, siempre explicado en contexto la primera vez que aparece.', gramatica: 'Oraciones de hasta 10 palabras, primeras subordinadas simples.' },
        '4° Grado Primaria': { label: '4° Grado Primaria', vocabulario: 'Específico del área con mayor variedad; se pueden introducir sinónimos y familias de palabras.', gramatica: 'Oraciones de hasta 12 palabras, subordinadas simples y conectores de secuencia (primero, luego, finalmente).' },
        '5° Grado Primaria': { label: '5° Grado Primaria', vocabulario: 'Técnico del área, con primeras nociones de argumentación y comparación.', gramatica: 'Oraciones de hasta 15 palabras, conectores de causa-consecuencia, subordinadas variadas.' },
        '6° Grado Primaria': { label: '6° Grado Primaria', vocabulario: 'Técnico del área y vocabulario académico de transición a secundaria, con nociones de argumentación.', gramatica: 'Oraciones más complejas, conectores de causa-consecuencia y contraste, primeras estructuras de análisis crítico.' },
        '1° Año Secundaria': { label: '1° Año Secundaria', vocabulario: 'Técnico del área, introducido en contexto pero ya sin simplificaciones excesivas; primeras nociones de terminología disciplinar.', gramatica: 'Oraciones de hasta 18 palabras, subordinadas variadas, conectores de causa-consecuencia y contraste.' },
        '2° Año Secundaria': { label: '2° Año Secundaria', vocabulario: 'Técnico consolidado del área, con primeros términos abstractos propios de la disciplina.', gramatica: 'Subordinadas múltiples, voz pasiva, conectores de consecuencia y concesión; inicio de argumentación con evidencia.' },
        '3° Año Secundaria': { label: '3° Año Secundaria', vocabulario: 'Académico y técnico específico, con matices de significado entre términos relacionados.', gramatica: 'Estructuras complejas con varias cláusulas, nexos de contraste y condición; argumentación con postura propia.' },
        '4° Año Secundaria': { label: '4° Año Secundaria', vocabulario: 'Especializado del área, incluyendo terminología de uso profesional o académico.', gramatica: 'Registro formal sostenido, estructuras condicionales y comparativas complejas, síntesis de múltiples fuentes.' },
        '5° Año Secundaria': { label: '5° Año Secundaria', vocabulario: 'Técnico-académico de nivel preuniversitario, con precisión terminológica exigida.', gramatica: 'Argumentación compleja y sostenida, con matización, contraargumentación y uso de evidencia para sustentar posturas.' },
        '6° Año Secundaria': { label: '6° Año Secundaria', vocabulario: 'Académico de transición a nivel universitario, con manejo autónomo de terminología especializada.', gramatica: 'Pensamiento crítico expresado con estructuras sofisticadas, argumentación multicausal y análisis con autonomía total.' }
    };

    // Reduce el nivel fino elegido a una de las 3 bandas que ya usan las
    // secciones del prompt (requisitos de extensión/complejidad por sección).
    const TIER_POR_NIVEL = {
        en: { A1: 'inicial', A2: 'inicial', B1: 'medio', B2: 'medio', C1: 'avanzado', C2: 'avanzado' },
        es: {
            '1° Grado Primaria': 'inicial', '2° Grado Primaria': 'inicial', '3° Grado Primaria': 'medio', '4° Grado Primaria': 'medio', '5° Grado Primaria': 'avanzado', '6° Grado Primaria': 'avanzado',
            // Secundaria ya arranca por encima del techo de "avanzado" de primaria;
            // no hay un 4° tier de sección, así que los 6 años usan el mismo techo.
            '1° Año Secundaria': 'avanzado', '2° Año Secundaria': 'avanzado', '3° Año Secundaria': 'avanzado',
            '4° Año Secundaria': 'avanzado', '5° Año Secundaria': 'avanzado', '6° Año Secundaria': 'avanzado'
        }
    };

    function tablaNiveles(idioma) {
        return idioma === 'en' ? NIVELES_EN : NIVELES_ES;
    }

    function tierPorNivel(idioma, nivel) {
        return TIER_POR_NIVEL[idioma]?.[nivel] || null;
    }

    function sincronizarSelectorNivel(idioma) {
        const select = document.getElementById('f-nivel');
        const label = document.getElementById('label-nivel');
        if (!select || !label) return;
        if (select.dataset.idioma === idioma) return;

        // Las salas existen en los dos idiomas: si había una elegida, se conserva.
        const salaPrevia = esSalaInicial(select.value) ? select.value : '';
        select.dataset.idioma = idioma;
        llenarSelectorNivel(select, tablaNiveles(idioma), idioma === 'en' ? 'Primaria y Secundaria (CEFR)' : 'Primaria y Secundaria');
        select.value = salaPrevia;
        if (!salaPrevia) delete select.dataset.autofilled;

        label.innerHTML = idioma === 'en'
            ? 'Sala o nivel de inglés <span class="optional-badge">(opcional)</span>'
            : 'Sala / Grado del alumno <span class="optional-badge">(opcional)</span>';

        if (window.contextoPUD) aplicarContextoPUD(window.contextoPUD);
        actualizarNombresSecciones();
    }

    function bloqueBandaEdad(nivel, idioma) {
        if (esSalaInicial(nivel)) {
            return `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n${bloqueCalibracionInicial(nivel, idioma === 'en')}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nTodo el material (cuento, preguntas, juegos y consignas) tiene que respetar este nivel.`;
        }
        const info = tablaNiveles(idioma)[nivel];
        if (!info) return null;
        return `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nCALIBRACIÓN POR NIVEL (${info.label})\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n- VOCABULARIO: ${info.vocabulario}\n- GRAMÁTICA/SINTAXIS: ${info.gramatica}`;
    }

    // Mismo diccionario de señales léxicas que ya usa index.html (detectarIdioma),
    // separado del veredicto final para poder reusar el conteo en textos cortos
    // (ver recolectarDatosFormulario).
    function contarSenalesIdioma(texto) {
        // Espacios al inicio/final para que las señales " el ", " la ", etc.
        // también matcheen cuando esa palabra es la primera o la última del
        // texto (si no, "El ciclo del agua" no matcheaba " el " por faltarle
        // el espacio previo, y un texto corto terminaba en empate 0 a 0).
        const cuerpo = ' ' + (texto || '').toLowerCase() + ' ';

        const spanishSignals = [
            ' y ', ' de ', ' la ', ' el ', ' los ', ' las ', ' que ', ' para ', ' por ',
            ' con ', ' una ', ' unos ', ' alumno', ' docente', ' unidad', ' materia',
            ' educación', ' enseñanza', ' aprendizaje', ' escuela', ' español'
        ];
        const englishSignals = [
            ' and ', ' of ', ' the ', ' for ', ' with ', ' that ', ' students', ' teachers', ' unit',
            ' subject', ' learning', ' school', ' class', ' english', ' bilingual', ' global', ' science', ' history'
        ];

        const countMatches = (terms) => terms.reduce((count, term) => {
            const regex = new RegExp(term.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&'), 'g');
            return count + ((cuerpo.match(regex) || []).length);
        }, 0);

        return { es: countMatches(spanishSignals), en: countMatches(englishSignals) };
    }

    function detectarIdiomaTexto(texto) {
        const cuerpo = (texto || '').toLowerCase().trim();
        if (!cuerpo) return 'es';

        // Señal fuerte y muy confiable: tildes/ñ/signos propios del castellano.
        if (/[áéíóúñ¿¡]/.test(cuerpo)) return 'es';

        const { es, en } = contarSenalesIdioma(cuerpo);
        if (es > en) return 'es';
        if (en > es) return 'en';

        // Empate a cero: sin tildes ni señales claras de ningún idioma, se
        // asume castellano por defecto (idioma principal de la escuela).
        return 'es';
    }

    function bloqueIdiomaSalida(idioma) {
        return idioma === 'en'
            ? `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nIDIOMA DE SALIDA: INGLÉS\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nToda la tarea generada (texto, preguntas, vocabulario, consignas y clave de corrección) debe redactarse íntegramente en inglés, sin importar el idioma de estas instrucciones.`
            : `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nIDIOMA DE SALIDA: CASTELLANO\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nToda la tarea generada debe redactarse íntegramente en castellano.`;
    }

    function escapeHtml(value = '') {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // ---- Contexto del PUD activo (contrato en pud-contexto.js) ----
    // Tareas muestra siempre las metas y, por defecto, solo los desempeños de
    // investigación guiada; el docente puede cambiarlo desde el bloque "Del PUD".
    // El prompt usa los mismos desempeños que se ven en el bloque.

    window.contextoPUD = null;
    let filtroDesempenos = 'investigacion_guiada';

    PudContexto.alRecibir(aplicarContextoPUD);

    function aplicarContextoPUD(ctx) {
        window.contextoPUD = ctx;

        const selectNivel = document.getElementById('f-nivel');
        // Las salas están en el selector de ambos idiomas; los grados, solo en castellano.
        if (ctx?.grado && selectNivel && (selectNivel.dataset.idioma === 'es' || esSalaInicial(ctx.grado))
            && (selectNivel.value === '' || selectNivel.dataset.autofilled === 'true')) {
            const opcion = Array.from(selectNivel.options).find(o => o.value === ctx.grado.trim());
            if (opcion) {
                selectNivel.value = opcion.value;
                selectNivel.dataset.autofilled = 'true';
            }
        }

        actualizarNombresSecciones();
        renderBloqueDelPud();
    }

    function renderBloqueDelPud() {
        PudContexto.renderBloque(document.getElementById('del-pud'), window.contextoPUD, {
            filtro: filtroDesempenos,
            conSelector: true,
            onFiltro: (nuevo) => { filtroDesempenos = nuevo; renderBloqueDelPud(); }
        });
    }

    function bloqueContextoPUD(ctx) {
        if (!ctx) return null;
        const lineas = [];
        if (ctx.materia) lineas.push(`- Materia/Área: ${ctx.materia}`);
        if (ctx.titulo) lineas.push(`- Unidad didáctica: ${ctx.titulo}`);
        if (ctx.metas?.length) lineas.push(`- Metas de comprensión de la unidad:\n${ctx.metas.map(m => `  · ${m.texto}`).join('\n')}`);
        const desempenos = PudContexto.desempenosFiltrados(ctx, filtroDesempenos);
        if (desempenos.length) {
            lineas.push(`- Desempeños del PUD a los que apunta esta tarea:\n${desempenos.map(d => `  · [${PudContexto.TIPOS[d.tipo]}] ${d.texto}`).join('\n')}`);
        }
        if (lineas.length === 0) return null;
        return `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nCONTEXTO DE LA UNIDAD DIDÁCTICA (PUD) ACTIVA\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nTené en cuenta este contexto para que la tarea sea coherente con la unidad en curso:\n${lineas.join('\n')}`;
    }

    // Cada 'body' recibe la banda de edad y devuelve el texto de la sección.
    // Sin banda (o banda sin regla propia), el resultado es idéntico al texto
    // fijo que la herramienta usaba antes de esta mejora.
    const sectionDefinitions = [
        {
            id: 1,
            header: 'SECCIÓN 1 — TEXTO INFORMATIVO',
            jardin: {
                nombre: 'Cuento para narrar',
                header: 'SECCIÓN 1 — CUENTO PARA NARRAR (lo cuenta la docente)',
                body: (sala) => {
                    const largo = { 'Sala de 3 años': '60 y 90', 'Sala de 4 años': '90 y 130', 'Sala de 5 años': '120 y 180' }[sala];
                    const claves = { 'Sala de 3 años': 3, 'Sala de 4 años': 4, 'Sala de 5 años': 5 }[sala];
                    return `Escribí un cuento breve y original sobre el tema para que la docente lo NARRE en ronda (los niños no lo leen). Requisitos:
- Entre ${largo} palabras
- Personajes cercanos (animales, chicos, objetos de la sala) y una situación simple con un pequeño problema que se resuelve
- Una frase que se repite a lo largo del cuento y que los chicos pueden decir juntos
- Indicá entre corchetes dónde usar títere, gesto, sonido u objeto real (ej.: [mostrar la regadera])
- Incluí ${claves} palabras clave del tema, siempre asociadas a algo que se pueda mostrar (se juegan en la Sección 4)
- Título con tono de cuento`;
                }
            },
            body: (banda) => {
                const requisitos = {
                    inicial: '- Entre 80 y 120 palabras\n- Oraciones muy cortas y simples (una idea por oración)\n- Vocabulario cotidiano y concreto',
                    avanzado: '- Entre 200 y 280 palabras\n- Oraciones más complejas, con conectores de causa/consecuencia\n- Vocabulario técnico permitido'
                }[banda] || '- Entre 150 y 220 palabras\n- Lenguaje claro, preciso y adecuado al nivel';
                return `Redactá un texto informativo original sobre el tema. Requisitos:
${requisitos}
- Debe cubrir los conceptos clave del tema
- Incluí al menos 5 palabras de vocabulario específico del tema (que luego se trabajarán en la Sección 4)
- Título atractivo para el texto`;
            }
        },
        {
            id: 2,
            header: 'SECCIÓN 2 — PREGUNTAS CERRADAS (Comprensión literal)',
            jardin: {
                nombre: 'Juego de elegir',
                header: 'SECCIÓN 2 — JUEGO DE ELEGIR (se responde con el cuerpo)',
                body: (sala) => `Proponé 3 preguntas sobre el cuento que los niños respondan con el cuerpo, sin leer ni escribir: señalar la imagen u objeto correcto, saltar hacia un lado de la sala, levantar una tarjeta de color, imitar al personaje.
- ${sala === 'Sala de 3 años' ? 'Solo 2 opciones por pregunta' : 'Hasta 3 opciones por pregunta'}, todas con imagen u objeto
- Preguntas de 10 palabras como máximo, con la respuesta en el cuento
- Indicá qué objetos o imágenes hay que preparar
- Si alguien se equivoca no hay "error": se vuelve al cuento entre todos`
            },
            body: (banda) => {
                const notaComplejidad = {
                    inicial: 'Usá lenguaje simple y directo en las opciones, evitando dobles negaciones o distractores ambiguos.',
                    avanzado: 'Las opciones incorrectas (distractores) deben ser plausibles y requerir atención al detalle para descartarlas.'
                }[banda];
                return `Formulá exactamente 3 preguntas cerradas sobre el texto de la Sección 1. Cada pregunta debe:
- Tener 3 opciones de respuesta (a, b, c)
- Solo una opción correcta
- Estar basada en información explícita del texto
- Evaluar comprensión literal o de detalle${notaComplejidad ? `\n- ${notaComplejidad}` : ''}`;
            }
        },
        {
            id: 3,
            header: 'SECCIÓN 3 — PREGUNTAS ABIERTAS (Comprensión profunda)',
            jardin: {
                nombre: 'Preguntas para la ronda',
                header: 'SECCIÓN 3 — PREGUNTAS PARA LA RONDA (conversación oral)',
                body: () => `Formulá 3 preguntas abiertas para conversar en ronda, de 10 palabras como máximo:
- la primera, para recordar algo del cuento
- la segunda, para imaginar ("¿Qué pasaría si...?")
- la tercera, para conectar con la vida del niño ("¿Vos alguna vez...?")
Se responden hablando, mostrando o dibujando; todas las respuestas valen. Sumá para cada una una repregunta que la docente pueda usar si nadie responde.`
            },
            body: (banda) => {
                const progresion = {
                    inicial: 'la primera de recordar un dato concreto del texto, la segunda de comprensión simple, la tercera de opinión personal breve',
                    avanzado: 'la primera de análisis, la segunda de evaluación crítica, la tercera de argumentación y transferencia a otros contextos'
                }[banda] || 'la primera de comprensión, la segunda de análisis, la tercera de opinión o transferencia';
                return `Formulá exactamente 3 preguntas abiertas. Deben:
- Requerir respuesta elaborada (no se responden con sí/no)
- Progresión cognitiva: ${progresion}
- Conectar el tema con experiencias reales o con otras áreas del conocimiento
- Dejar espacio visible para la respuesta del alumno (indicar: "Respuesta: ___________")`;
            }
        },
        {
            id: 4,
            header: 'SECCIÓN 4 — ACTIVIDAD DE VOCABULARIO',
            jardin: {
                nombre: 'Juego de palabras',
                header: 'SECCIÓN 4 — JUEGO DE PALABRAS',
                body: () => `Diseñá UN juego con las palabras clave del cuento. Elegí el formato que mejor se adapte al tema, solo uno de estos:
- Opción A: Canción o rima con un gesto para cada palabra
- Opción B: Adivinanzas con objetos escondidos en una bolsa o caja
- Opción C: Juego de memoria o de "buscar en la sala" con imágenes grandes
Cada palabra va siempre asociada a un objeto, imagen o gesto. Escribí la consigna oral textual para los niños y cómo se juega, paso a paso.`
            },
            body: (banda) => {
                const notaDefiniciones = {
                    inicial: 'Las definiciones deben ser muy simples, con ejemplos concretos y cotidianos (evitá definiciones circulares o abstractas).',
                    avanzado: 'Las definiciones pueden incluir matices técnicos y relacionarse con otros conceptos del tema.'
                }[banda];
                return `Diseñá UNA actividad de vocabulario usando exactamente las 5 palabras clave del texto. Elegí el formato más adecuado al tipo de contenido, solo uno de estos:
- Opción A: Unir con flechas (palabra → definición)
- Opción B: Completar oraciones con el banco de palabras
- Opción C: Clasificar palabras en categorías

Indicá claramente el formato elegido y presentá la actividad lista para el alumno.${notaDefiniciones ? `\n${notaDefiniciones}` : ''}`;
            }
        },
        {
            id: 5,
            header: 'SECCIÓN 5 — CLAVE DE CORRECCIÓN (solo para el docente)',
            jardin: {
                nombre: 'Guía de observación',
                header: 'SECCIÓN 5 — GUÍA DE OBSERVACIÓN (solo para la docente)',
                body: () => `Al final del documento, agregá una guía para la docente (no es una corrección ni una calificación):
- 3 a 5 indicadores concretos y observables de lo que los niños descubrieron (ej.: "nombra al menos dos animales del cuento")
- Respuestas esperadas del juego de elegir (Sección 2)
- Cómo documentarlo: foto, audio o anotación breve
Marcá esta sección con el encabezado: ✂ --- GUÍA DOCENTE ---`
            },
            body: () => `Al final del documento, agregá una clave de corrección que incluya:
- Respuestas correctas de las preguntas cerradas (Sección 2)
- Criterios o ideas esperadas para las preguntas abiertas (Sección 3)
- Solución de la actividad de vocabulario (Sección 4)

Marcá esta sección claramente con el encabezado: ✂ --- CLAVE DOCENTE (no entregar al alumno) ---`
        }
    ];

    // Con una sala elegida, las tarjetas muestran la versión de Jardín de
    // cada sección (cuento, juego de elegir, ronda...) en vez de la escolar.
    function actualizarNombresSecciones() {
        const sala = esSalaInicial(document.getElementById('f-nivel')?.value);
        document.querySelectorAll('.selection-card').forEach(card => {
            const id = Number(card.querySelector('input').value);
            const nombreEl = card.querySelector('.name');
            const def = sectionDefinitions.find(s => s.id === id);
            if (!nombreEl || !def) return;
            if (!nombreEl.dataset.original) nombreEl.dataset.original = nombreEl.textContent;
            nombreEl.textContent = sala ? def.jardin.nombre : nombreEl.dataset.original;
        });
    }

    function actualizarEstadoSeleccion() {
        document.querySelectorAll('.selection-card').forEach(card => {
            const checkbox = card.querySelector('input[type="checkbox"]');
            card.classList.toggle('selected', checkbox.checked);
        });
    }

    document.querySelectorAll('.section-toggle').forEach(checkbox => {
        checkbox.addEventListener('change', actualizarEstadoSeleccion);
    });

    // El selector de nivel muestra CEFR o edad/grado según el idioma detectado
    // en el tema tipeado, y se actualiza en vivo mientras el docente escribe.
    const campoTema = document.getElementById('f-tema');
    sincronizarSelectorNivel(detectarIdiomaTexto(campoTema.value));
    // "Cambios sin guardar" = hay un tema escrito que todavía no se
    // convirtió en prompt (o cambió desde el último prompt generado).
    let temaDelUltimoPrompt = '';
    function avisarSiHayCambios() {
        const actual = campoTema.value.trim();
        PudContexto.avisarCambios(actual !== '' && actual !== temaDelUltimoPrompt);
    }

    campoTema.addEventListener('input', () => {
        sincronizarSelectorNivel(detectarIdiomaTexto(campoTema.value));
        avisarSiHayCambios();
    });

    // Si el docente toca el selector a mano, esa elección ya no es "autofill":
    // sin este flag, la próxima vez que llega el contexto del PUD (ej. al
    // volver a esta pestaña) pisaba silenciosamente la elección manual.
    document.getElementById('f-nivel').addEventListener('change', function () {
        delete this.dataset.autofilled;
        actualizarNombresSecciones();
    });

    // ---- L2: recolectar datos / armar bloques / unir prompt ----

    function recolectarDatosFormulario() {
        const tema = document.getElementById('f-tema').value.trim();
        const contexto = window.contextoPUD;

        // El idioma de salida depende únicamente del tema (el input propio de
        // esta herramienta) — deliberadamente NO se mezcla con el contexto del
        // PUD: que el docente tenga abierta una PUD en otro idioma no debería
        // cambiar en qué idioma sale una tarea cuyo tema él mismo tipeó.
        const idioma = detectarIdiomaTexto(tema);

        return {
            tema,
            nivel: document.getElementById('f-nivel').value,
            idioma,
            contexto,
            selectedIds: Array.from(document.querySelectorAll('.section-toggle:checked'))
                .map(checkbox => Number(checkbox.value))
                .sort((a, b) => a - b)
        };
    }

    function armarBloques(datos) {
        const sala = esSalaInicial(datos.nivel) ? datos.nivel : null;
        const tier = tierPorNivel(datos.idioma, datos.nivel);
        const selectedSections = sectionDefinitions.filter(section => datos.selectedIds.includes(section.id));
        const sectionsText = selectedSections.map(section => {
            const header = sala ? section.jardin.header : section.header;
            const body = sala ? section.jardin.body(sala) : section.body(tier);
            return `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n${header}\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n${body}`;
        }).join('\n\n');

        // P3: duración inferida de la cantidad de secciones combinadas (no es un campo nuevo).
        // En Jardín la duración la fija la edad de la sala, no la cantidad de secciones.
        const duracionEstimada = sala
            ? `experiencias de ${EJECUCION_INICIAL[sala].minutos} minutos cada una, con pausas de movimiento entre una y otra`
            : selectedSections.length <= 1
                ? 'una actividad corta (10-15 minutos)'
                : selectedSections.length <= 3
                    ? 'una actividad de duración media (20-30 minutos)'
                    : 'una clase completa (40-50 minutos)';

        return {
            contextoPUD: bloqueContextoPUD(datos.contexto),
            idiomaSalida: bloqueIdiomaSalida(datos.idioma),
            bandaEdad: bloqueBandaEdad(datos.nivel, datos.idioma),
            secciones: sectionsText,
            duracionEstimada
        };
    }

    function unirPrompt(datos, bloques) {
        const extras = [bloques.contextoPUD, bloques.idiomaSalida, bloques.bandaEdad]
            .filter(Boolean)
            .map(bloque => `\n\n${bloque}`)
            .join('');

        if (esSalaInicial(datos.nivel)) {
            return `Actúa como una docente experta en Nivel Inicial (Jardín) y en educación bilingüe.

Tu tarea es crear una PROPUESTA DE JUEGOS PARA LA SALA (no una tarea escrita ni una ficha) sobre el siguiente tema:

---
${datos.tema}
---${extras}

${bloqueReglasInicial(datos.nivel, datos.idioma === 'en')}

La propuesta debe estar organizada en las secciones seleccionadas, en este orden:

${bloques.secciones}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
RESTRICCIONES GENERALES:
- Todo el material es para que la docente lo use con los niños: no hay nada para imprimir, entregar ni resolver por escrito
- No agregues introducciones, fundamentación teórica ni texto fuera del formato solicitado
- Usá los separadores visuales indicados para cada sección
- La propuesta está pensada para ${bloques.duracionEstimada}`;
        }

        return `Actúa como un docente experto en diseño de materiales educativos para educación primaria y secundaria bilingüe.

Tu tarea es crear una TAREA COMPLETA Y LISTA PARA EL AULA sobre el siguiente tema:

---
${datos.tema}
---${extras}

La tarea debe estar organizada en las secciones seleccionadas, en este orden:

${bloques.secciones}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
RESTRICCIONES GENERALES:
- El output debe estar listo para imprimir y entregar al alumno, excepto en las secciones que correspondan al docente
- No agregues introducciones, aclaraciones metodológicas ni texto fuera del formato solicitado
- Usá los separadores visuales indicados para cada sección
- Esta tarea está pensada para ${bloques.duracionEstimada} de trabajo en el aula`;
    }

    function construirPrompt() {
        const datos = recolectarDatosFormulario();
        if (!datos.tema) { alert("Ingresá un tema o contenido."); return; }
        if (datos.selectedIds.length === 0) {
            alert("Seleccioná al menos una sección para generar el prompt.");
            return;
        }

        const bloques = armarBloques(datos);
        const prompt = unirPrompt(datos, bloques);
        document.getElementById('output-box').textContent = prompt;
        temaDelUltimoPrompt = datos.tema;
        avisarSiHayCambios();
    }

    async function copiar() {
        const box = document.getElementById('output-box');
        const btn = document.querySelector('.btn-copy');
        const texto = box.textContent;

        if (texto.startsWith("Completá")) { alert("Primero generá el prompt."); return; }

        try {
            await navigator.clipboard.writeText(texto);
        } catch {
            const ta = document.createElement('textarea');
            ta.value = texto;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
        }

        const orig = btn.textContent;
        btn.textContent = "¡Copiado!";
        btn.style.background = "#16a34a";
        setTimeout(() => { btn.textContent = orig; btn.style.background = ""; }, 1500);
    }
</script>
</body>
</html>
