<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Generator | Austin EBS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --austin-blue: #1a2e5a;
            --austin-red: #8b1d22;
            --austin-light-blue: #e8ecf3;
            --austin-gray: #f8f9fa;
            --white: #ffffff;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--austin-gray);
            margin: 0; padding: 40px 20px;
            color: #333;
            display: flex; justify-content: center;
        }

        .container {
            width: 100%; max-width: 1000px;
            background: var(--white); padding: 40px;
            border-radius: 12px; border-top: 12px solid var(--austin-blue);
            box-shadow: var(--shadow); box-sizing: border-box;
        }

        header { border-bottom: 2px solid var(--austin-red); margin-bottom: 30px; padding-bottom: 15px; }
        h1 { color: var(--austin-blue); margin: 0; font-size: 1.5rem; text-transform: uppercase; font-weight: 800; }

        .grid-config {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .grid-contenido {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group { display: flex; flex-direction: column; }
        label { font-weight: 700; margin-bottom: 8px; color: var(--austin-blue); font-size: 0.75rem; text-transform: uppercase; }
        .optional-text { text-transform: none; font-weight: 400; color: #94a3b8; }

        select, textarea {
            width: 100%; padding: 12px; border: 2px solid var(--austin-light-blue);
            border-radius: 6px; font-size: 0.95rem; box-sizing: border-box;
            outline: none; transition: var(--transition);
        }
        select:focus, textarea:focus { border-color: var(--austin-blue); }
        textarea { height: 160px; line-height: 1.5; font-family: inherit; }

        /* Selector de perfiles: tarjetas con checkbox (mismo patrón de interacción
           que ya usa generador-tareas.html en este proyecto para selección múltiple) */
        .perfiles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
        }

        .perfil-card {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            border: 2px solid var(--austin-light-blue);
            border-radius: 6px;
            padding: 10px 12px;
            cursor: pointer;
            transition: var(--transition);
        }
        .perfil-card:hover { border-color: var(--austin-blue); }
        .perfil-card.selected {
            border-color: var(--austin-blue);
            background: var(--austin-light-blue);
        }
        .perfil-card input {
            margin-top: 3px;
            cursor: pointer;
            flex-shrink: 0;
            accent-color: var(--austin-blue);
        }
        .perfil-card span {
            font-size: 0.88rem;
            font-weight: 600;
            color: #333;
            line-height: 1.3;
        }

        .hint-text {
            grid-column: 1 / -1;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        button {
            background-color: var(--austin-red); color: white;
            padding: 16px; border: none; border-radius: 6px;
            cursor: pointer; font-weight: 700; width: 100%;
            font-size: 1rem; text-transform: uppercase; letter-spacing: 1px;
            transition: var(--transition);
        }
        button:hover { background-color: var(--austin-blue); }
        button:disabled { background-color: #cbd5e0; cursor: not-allowed; }

        .output-wrapper {
            margin-top: 35px;
            background: #1e293b;
            padding: 25px;
            border-radius: 8px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .output-header label { color: #94a3b8; }

        .btn-copy {
            background-color: var(--austin-blue);
            padding: 6px 15px;
            font-size: 0.8rem;
            width: auto;
            border-radius: 4px;
        }

        #output-box {
            width: 100%; min-height: 250px;
            background-color: #0f172a;
            padding: 20px;
            border: 1px solid #334155;
            border-radius: 6px;
            box-sizing: border-box;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            outline: none;
            line-height: 1.6;
            color: #cbd5e1;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
        }

        @media (max-width: 1024px) {
            .container {
                padding: 32px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 24px 14px;
            }

            .container {
                padding: 24px;
                border-radius: 8px;
            }

            .grid-config,
            .grid-contenido {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.35rem;
            }

            .output-wrapper {
                padding: 20px;
            }

            #output-box {
                min-height: 240px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>AI Prompt Generator para Adaptaciones</h1>
    </header>

    <div class="form-group" style="margin-bottom: 25px;">
        <label>Perfiles del Alumno <span class="optional-text">(podés marcar más de uno)</span></label>
        <div id="perfiles-selector" class="perfiles-grid">
            <p class="hint-text">Cargando perfiles...</p>
        </div>
    </div>

    <div class="grid-config">
        <div class="form-group">
            <label for="idioma">Idioma</label>
            <select id="idioma" onchange="cargarNiveles()">
                <option value="es">Castellano (L1)</option>
                <option value="en">Inglés (L2)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="nivel">Complejidad Cognitiva</label>
            <select id="nivel"></select>
        </div>
    </div>

    <div class="grid-contenido">
        <div class="form-group">
            <label for="texto-original">Texto explicativo <span class="optional-text">(opcional)</span></label>
            <textarea id="texto-original" placeholder="Pegue el texto informativo o explicativo, si lo hay..."></textarea>
        </div>

        <div class="form-group">
            <label for="actividad-original">Actividad / Consigna <span class="optional-text">(opcional)</span></label>
            <textarea id="actividad-original" placeholder="Pegue la actividad o consigna ya armada, si la hay..."></textarea>
        </div>
    </div>

    <button id="btn-generar" onclick="construirPrompt()">CONSTRUIR PROMPT PARA GEMINI</button>

    <div class="output-wrapper">
        <div class="output-header">
            <label>Prompt Final Configurado</label>
            <button class="btn-copy" onclick="copiarAlPortapapeles()">Copiar Prompt</button>
        </div>
        <div id="output-box" contenteditable="false">Complete los campos de arriba y presione el botón para generar el prompt...</div>
    </div>
</div>

<script>
    // --- CONFIGURACIÓN CONEXIÓN REAL SUPABASE ---
    const SUPABASE_URL = 'https://kretfnbddhbosacfgdup.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtyZXRmbmJkZGhib3NhY2ZnZHVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE0Mjk3MTcsImV4cCI6MjA4NzAwNTcxN30.P0HLqGab3tB5WdsVGYKXEyK572JvthHYFg7iu3MJpgo';

    let supabaseClient = null;
    try {
        if (SUPABASE_URL.startsWith('http')) {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } else {
            console.error("SUPABASE_URL inválida.");
        }
    } catch (e) {
        console.error("Error al inicializar el cliente de Supabase:", e);
    }

    // Fallbacks: se usan solo si la consulta a Supabase falla o no devuelve filas,
    // para que la herramienta siga siendo usable. La fuente de verdad normal es la DB.
    const PERFILES_FALLBACK = [
        { perfil_slug: 'fonologico', lineamientos: { nombre: 'Dislexia Leve (Fonológica)' } },
        { perfil_slug: 'superficial', lineamientos: { nombre: 'Dislexia Severa (Superficial)' } },
        { perfil_slug: 'tea', lineamientos: { nombre: 'TEA (Literalidad y Estructura)' } }
    ];

    const NIVELES_FALLBACK = {
        es: [
            { val: "alfab_inicial", lab: "Alfabetización Inicial" },
            { val: "lector_fluido", lab: "Lectura Fluida / Consolidada" },
            { val: "informativo", lab: "Texto Informativo / Secundaria" },
            { val: "academico", lab: "Texto Académico / Superior" }
        ],
        en: [
            { val: "pre_a1", lab: "Pre-A1 (Starters/Kids)" },
            { val: "a1_a2", lab: "A1/A2 (Movers/Key)" },
            { val: "b1", lab: "B1 (Intermediate/PET)" },
            { val: "b2", lab: "B2 (Upper-Int/FCE)" }
        ]
    };

    window.perfilesDisponibles = [];

    function formatearSlug(slug) {
        return (slug || '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    // ---- Etapa 2: carga dinámica de perfiles y niveles ----

    async function cargarPerfiles() {
        const contenedor = document.getElementById('perfiles-selector');
        let perfiles = PERFILES_FALLBACK;

        if (supabaseClient) {
            const { data, error } = await supabaseClient.from('perfiles_dislexia').select('perfil_slug, lineamientos');
            if (!error && data && data.length > 0) perfiles = data;
        }

        window.perfilesDisponibles = perfiles;

        contenedor.innerHTML = perfiles.map(p => `
            <label class="perfil-card">
                <input type="checkbox" class="perfil-toggle" value="${p.perfil_slug}">
                <span>${(p.lineamientos && p.lineamientos.nombre) || formatearSlug(p.perfil_slug)}</span>
            </label>
        `).join('');

        contenedor.querySelectorAll('.perfil-toggle').forEach(checkbox => {
            checkbox.addEventListener('change', () => {
                checkbox.closest('.perfil-card').classList.toggle('selected', checkbox.checked);
            });
        });
    }

    async function cargarNiveles() {
        const idioma = document.getElementById('idioma').value;
        const selectorNivel = document.getElementById('nivel');
        if (!selectorNivel) return;

        let opciones = NIVELES_FALLBACK[idioma] || [];

        if (supabaseClient) {
            const { data, error } = await supabaseClient
                .from('niveles_idioma')
                .select('nivel_slug, descripcion_tecnica')
                .eq('idioma_code', idioma);

            if (!error && data && data.length > 0) {
                opciones = data.map(row => ({
                    val: row.nivel_slug,
                    lab: (row.descripcion_tecnica && row.descripcion_tecnica.nombre) || formatearSlug(row.nivel_slug)
                }));
            }
        }

        selectorNivel.innerHTML = "";
        opciones.forEach(o => {
            const opt = document.createElement('option');
            opt.value = o.val;
            opt.textContent = o.lab;
            selectorNivel.appendChild(opt);
        });
    }

    document.addEventListener("DOMContentLoaded", function() {
        cargarPerfiles();
        cargarNiveles();
    });

    // ---- Etapa 3: detección automática del tipo de contenido ----

    function detectarTipoContenido(texto, actividad) {
        const hayTexto = !!(texto && texto.trim());
        const hayActividad = !!(actividad && actividad.trim());
        if (hayTexto && hayActividad) return 'ambos';
        if (hayTexto) return 'texto';
        if (hayActividad) return 'actividad';
        return null;
    }

    // ---- Etapa 4: bloques de prompt (cada función devuelve texto o null) ----

    function bloqueContexto() {
        return `Actúa como un Diseñador de Experiencias de Aprendizaje (LX Designer) senior, especialista en Diseño Universal para el Aprendizaje (DUA), neurodiversidad y diseño de materiales de evaluación para exámenes internacionales.`;
    }

    function bloqueTipoContenido(tipo) {
        const detalle = {
            texto: 'El docente proporcionó únicamente un TEXTO EXPLICATIVO, sin actividad asociada. Adaptá el texto y diseñá una única actividad de verificación de comprensión.',
            actividad: 'El docente proporcionó únicamente una ACTIVIDAD/CONSIGNA ya armada, sin texto explicativo. Adaptá exclusivamente esa actividad; no hables de comprensión de un texto que no existe.',
            ambos: 'El docente proporcionó un TEXTO EXPLICATIVO y una ACTIVIDAD/CONSIGNA ya armada. Adaptá cada uno por separado, sin mezclarlos.'
        };
        return `[TIPO DE CONTENIDO]\n${detalle[tipo]}`;
    }

    function bloqueObjetivo() {
        return `[OBJETIVO]\nTu tarea no es resumir ni infantilizar el contenido original, sino realizar una TRANSPOSICIÓN DIDÁCTICA PROFESIONAL aplicando andamiaje cognitivo estricto.`;
    }

    // Consolida las restricciones de todos los perfiles marcados sin repetir
    // encabezados por perfil: agrupa por categoría y solo distingue entre
    // perfiles cuando sus valores realmente difieren.
    function bloquePerfiles(perfiles) {
        if (!perfiles || perfiles.length === 0) return null;

        const categorias = [
            { key: 'visual', label: 'VISUAL' },
            { key: 'sintaxis', label: 'SINTAXIS' },
            { key: 'lexico', label: 'LÉXICO' },
            { key: 'instrucciones', label: 'INSTRUCCIONES' }
        ];

        const nombres = perfiles.map(p => p.lineamientos?.nombre || p.perfil_slug).join(', ');

        const lineas = categorias.map(categoria => {
            const valoresUnicos = new Map();
            perfiles.forEach(p => {
                const valor = p.lineamientos?.[categoria.key];
                if (!valor) return;
                const nombrePerfil = p.lineamientos?.nombre || p.perfil_slug;
                if (!valoresUnicos.has(valor)) valoresUnicos.set(valor, []);
                valoresUnicos.get(valor).push(nombrePerfil);
            });

            const detalle = Array.from(valoresUnicos.entries())
                .map(([valor, nombresPerfil]) => perfiles.length > 1 ? `${valor} (${nombresPerfil.join(', ')})` : valor)
                .join(' | ');

            return detalle ? `- ${categoria.label}: ${detalle}` : null;
        }).filter(Boolean);

        return `[PERFIL DEL ALUMNO]\nAplicá con máxima jerarquía, de forma simultánea, los lineamientos de: ${nombres}.\n${lineas.join('\n')}`;
    }

    function bloqueRestriccionesIdioma(idiomaText, nivelLabel, matrizNivel) {
        return `[RESTRICCIONES DE IDIOMA]
- IDIOMA OBJETIVO: ${idiomaText}
- NIVEL OBJETIVO: ${nivelLabel}
- VOCABULARIO PERMITIDO: ${matrizNivel ? matrizNivel.vocabulario : 'Vocabulario estándar del nivel.'}
- GRAMÁTICA PERMITIDA: ${matrizNivel ? matrizNivel.gramatica : 'Gramática estándar del nivel.'}
- RESTRICCIÓN LINGÜÍSTICA: ${matrizNivel ? matrizNivel.restriccion : 'Sin restricciones adicionales.'}`;
    }

    function bloqueQueMantener() {
        return `[QUÉ MANTENER]\nNo elimines datos esenciales, fechas o nombres requeridos para los objetivos de aprendizaje; reestructuralos linealmente en vez de quitarlos.`;
    }

    function bloqueQueModificarTexto() {
        return `[QUÉ MODIFICAR — TEXTO]
1. GLOSARIO DE ANCLAJE (soporte léxico previo): antes del texto principal, extraé hasta 3 conceptos técnicos indispensables (nombres históricos, procesos científicos, etc.) que superen el nivel del alumno o impliquen abstracción. Definilos con lenguaje 100% denotativo y concreto, aplicando la regla visual del perfil.
2. TEXTO ADAPTADO POR SEGMENTACIÓN (chunking): dividí el texto en bloques informativos independientes de máximo 3 oraciones cada uno, respetando la restricción sintáctica del perfil. Separá cada bloque con una línea divisoria clara.`;
    }

    function bloqueQueModificarActividadNueva() {
        return `[QUÉ MODIFICAR — ACTIVIDAD DE VERIFICACIÓN]
Como no se proporcionó una actividad original, diseñá UNA única actividad para verificar comprensión del texto. Elegí EXCLUSIVAMENTE uno de estos tres formatos (prohibido combinar más de uno):
- Opción A (comprensión de detalles): formato 'Cloze' (texto con lagunas) con su Word Bank.
- Opción B (clasificación lógica): tarea de categorización por listas (elementos o causas/consecuencias).
- Opción C (verificación literal): bloque de enunciados directos para marcar Right/Wrong (máximo 4 enunciados).`;
    }

    function bloqueQueModificarActividadExistente() {
        return `[QUÉ MODIFICAR — ACTIVIDAD EXISTENTE]
Adaptá la actividad/consigna ya proporcionada aplicando las restricciones del perfil; no inventes un formato nuevo ni la reemplaces. Simplificá su redacción, reestructurá su presentación visual y ajustá su complejidad, conservando su objetivo de evaluación original.`;
    }

    function bloqueFormatoSalida() {
        return `[FORMATO DE SALIDA]\nDevolvé DIRECTAMENTE el material adaptado, maquetado según las reglas visuales del perfil. No agregues prefacios, introducciones, saludos ni justificaciones metodológicas dirigidas al docente. El output debe estar listo para entregar al alumno.`;
    }

    // ---- Orquestador ----

    async function construirPrompt() {
        const btn = document.getElementById('btn-generar');
        const output = document.getElementById('output-box');

        const perfilesSlugs = Array.from(document.querySelectorAll('.perfil-toggle:checked')).map(cb => cb.value);
        const idiomaCode = document.getElementById('idioma').value;
        const selectorNivel = document.getElementById('nivel');
        const textoOriginal = document.getElementById('texto-original').value.trim();
        const actividadOriginal = document.getElementById('actividad-original').value.trim();

        // ---- Etapa 5: validaciones ----
        if (perfilesSlugs.length === 0) {
            alert("Seleccioná al menos un perfil de alumno.");
            return;
        }
        if (!selectorNivel || selectorNivel.options.length === 0) {
            alert("Error en la interfaz: los niveles no están cargados.");
            return;
        }

        const tipoContenido = detectarTipoContenido(textoOriginal, actividadOriginal);
        if (!tipoContenido) {
            alert("Ingresá un texto explicativo y/o una actividad para adaptar.");
            return;
        }

        const nivelSlug = selectorNivel.value;
        const nivelLabel = selectorNivel.options[selectorNivel.selectedIndex].text;

        try {
            btn.disabled = true;
            output.innerText = "Consultando matrices técnicas en Supabase...";

            const perfilesSeleccionados = window.perfilesDisponibles.filter(p => perfilesSlugs.includes(p.perfil_slug));

            let matrizNivel = null;
            if (supabaseClient) {
                const { data, error } = await supabaseClient
                    .from('niveles_idioma')
                    .select('descripcion_tecnica')
                    .eq('idioma_code', idiomaCode)
                    .eq('nivel_slug', nivelSlug);
                if (!error && data && data.length > 0) matrizNivel = data[0].descripcion_tecnica;
            }

            const idiomaText = idiomaCode === 'es' ? 'Castellano (Español)' : 'Inglés (English)';

            output.innerText = "Estructurando prompt...";

            const bloques = [
                bloqueContexto(),
                bloqueTipoContenido(tipoContenido),
                bloqueObjetivo(),
                bloquePerfiles(perfilesSeleccionados),
                bloqueRestriccionesIdioma(idiomaText, nivelLabel, matrizNivel),
                bloqueQueMantener(),
                (tipoContenido === 'texto' || tipoContenido === 'ambos') ? bloqueQueModificarTexto() : null,
                (tipoContenido === 'actividad' || tipoContenido === 'ambos') ? bloqueQueModificarActividadExistente() : null,
                (tipoContenido === 'texto') ? bloqueQueModificarActividadNueva() : null,
                bloqueFormatoSalida()
            ].filter(Boolean);

            const secciones = [
                textoOriginal ? `========================================\nTEXTO ORIGINAL:\n========================================\n${textoOriginal}` : null,
                actividadOriginal ? `========================================\nACTIVIDAD / CONSIGNA ORIGINAL:\n========================================\n${actividadOriginal}` : null
            ].filter(Boolean);

            const promptFinal = [...bloques, ...secciones].join('\n\n');
            output.innerText = promptFinal.trim();

        } catch (err) {
            console.error(err);
            output.innerText = "Error: " + err.message;
        } finally {
            btn.disabled = false;
        }
    }

    async function copiarAlPortapapeles() {
        const box = document.getElementById('output-box');
        const btn = document.querySelector('.btn-copy');
        const texto = box.innerText;

        if (texto.startsWith("Complete los campos de arriba")) { alert("Primero debes generar el prompt."); return; }

        try {
            await navigator.clipboard.writeText(texto);
            const originalText = btn.innerText;
            btn.innerText = "¡COPIADO!";
            btn.style.backgroundColor = "#28a745";
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.backgroundColor = "var(--austin-blue)";
            }, 1500);
        } catch (err) {
            const textArea = document.createElement("textarea");
            textArea.value = texto;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                btn.innerText = "¡COPIADO!";
                btn.style.backgroundColor = "#28a745";
                setTimeout(() => {
                    btn.innerText = "Copiar Prompt";
                    btn.style.backgroundColor = "var(--austin-blue)";
                }, 1500);
            } catch (fallbackErr) {
                alert("Error al copiar. Selecciona el texto manualmente.");
            }
            document.body.removeChild(textArea);
        }
    }
</script>

</body>
</html>
